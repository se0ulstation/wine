<title>CellarOS</title>
<style>
@font-face{font-family:Pretendard;font-weight:45 930;font-style:normal;font-display:swap;
  src:url(data:font/woff2;base64,__FONT__) format("woff2")}
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --sunken:#F7F7F7; --line:#E5E5E5; --line-2:#CFCFCF;
  --ink:#111111; --ink-2:#666666; --ink-3:#9A9A9A;
  --red:#C2352B; --green:#1B7F4E;
  --b-past:#DADADA; --b-ready:#1B7F4E; --b-hold:#3F3F3F;
  --shadow:0 12px 40px rgba(0,0,0,.13);
  --font:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --panel:#0F0F0F; --sunken:#161616; --line:#242424; --line-2:#383838;
  --ink:#EDEDED; --ink-2:#9A9A9A; --ink-3:#676767;
  --red:#E8695D; --green:#4FAF7C;
  --b-past:#2E2E2E; --b-ready:#4FAF7C; --b-hold:#DCDCDC;
  --shadow:0 12px 40px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --panel:#0F0F0F; --sunken:#161616; --line:#242424; --line-2:#383838;
  --ink:#EDEDED; --ink-2:#9A9A9A; --ink-3:#676767;
  --red:#E8695D; --green:#4FAF7C;
  --b-past:#2E2E2E; --b-ready:#4FAF7C; --b-hold:#DCDCDC;
  --shadow:0 12px 40px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0}
h1,h2,h3{margin:0;font-weight:600}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* header */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;
  padding:16px 20px 13px;border-bottom:1px solid var(--line)}
h1{font-size:16px;letter-spacing:-.01em}
header .meta{font-size:11.5px;color:var(--ink-3);letter-spacing:.01em}
header .meta b{font-weight:500;color:var(--ink-2)}
header .keys{margin-left:auto;font-size:11px;color:var(--ink-3)}
header .keys b{font-weight:500;color:var(--ink-2);border:1px solid var(--line);
  border-radius:3px;padding:0 4px;margin-right:2px}

.wrap{padding:16px 20px 40px;display:grid;gap:16px;max-width:1440px;margin:0 auto}
.two{display:grid;gap:16px}
@media (min-width:940px){.two{grid-template-columns:1fr 1fr}}
.two.wide{grid-template-columns:1fr}
@media (min-width:940px){.two.wide{grid-template-columns:1.05fr .95fr;align-items:start}}
.three{display:grid;gap:16px}
@media (min-width:940px){.three{grid-template-columns:1fr 1fr 1fr}}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:4px}
@media (min-width:640px){.sum{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.sum{grid-template-columns:repeat(6,1fr)}}
.sum>div{padding:12px 14px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.sum>div:nth-child(-n+2){border-top:0}
.sum>div:nth-child(2n+1){border-left:0}
@media (min-width:640px){.sum>div{border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .sum>div:nth-child(-n+3){border-top:0}.sum>div:nth-child(2n+1){border-left:1px solid var(--line)}
  .sum>div:nth-child(3n+1){border-left:0}}
@media (min-width:1000px){.sum>div{border-top:0;border-left:1px solid var(--line)}
  .sum>div:nth-child(3n+1){border-left:1px solid var(--line)}.sum>div:first-child{border-left:0}}
.sum dt{font-size:11px;color:var(--ink-3);margin-bottom:3px}
.sum dd{margin:0;font-size:21px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.sum dd small{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-left:3px;letter-spacing:0}

/* panel */
.p{border:1px solid var(--line);border-radius:4px;background:var(--panel);
   display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ph{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex:none}
.ph h2{font-size:12.5px;letter-spacing:-.005em}
.ph .r{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap}

/* facts */
.fact{display:flex;align-items:baseline;gap:12px;width:100%;padding:8px 14px;text-align:left;
  border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit}
.fact:first-child{border-top:0}
.fact.hit{cursor:pointer}
.fact.hit:hover{background:var(--sunken)}
.fact dt,.fact .k{font-size:12.5px;color:var(--ink-2);flex:1;min-width:0}
.fact .v{font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;white-space:nowrap}
.fact.on{background:var(--sunken);box-shadow:inset 2px 0 0 var(--ink)}

/* insights */
.ins{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;
  color:inherit;font:inherit;padding:11px 14px;cursor:pointer;display:grid;gap:3px}
.ins:first-child{border-top:0}
.ins:hover{background:var(--sunken)}
.ins.on{background:var(--sunken);box-shadow:inset 2px 0 0 var(--ink)}
.ins .top{display:flex;align-items:baseline;gap:8px}
.ins .kick{font-size:10.5px;color:var(--ink-3);flex:none}
.ins .kick.act{color:var(--red)}
.ins h3{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.ins p{margin:0;font-size:12.3px;color:var(--ink-3);line-height:1.6}

/* charts */
.plot{position:relative;padding:12px 14px 6px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--line);stroke-width:1}
.axis{fill:var(--ink-3);font-size:9.5px;font-variant-numeric:tabular-nums}
.band{stroke:var(--panel);stroke-width:2;stroke-linejoin:round}
.dlabel{font-size:10px;font-weight:500;dominant-baseline:middle}
.qlabel{fill:var(--ink-3);font-size:10px;paint-order:stroke fill;stroke:var(--panel);
  stroke-width:3.5px;stroke-linejoin:round}
.quadline{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 3}
.cross{stroke:var(--ink-3);stroke-width:1}
.dot{cursor:pointer;stroke:var(--panel);stroke-width:1.5}
.dot:hover{stroke:var(--ink)}
.dot.off{opacity:.12}
.dot.sel{stroke:var(--ink);stroke-width:2.5}
.quadhit{cursor:pointer;fill:transparent}
.quadhit:hover{fill:var(--ink);fill-opacity:.035}
.quadhit.on{fill:var(--ink);fill-opacity:.055}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--bg);
  border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow);padding:8px 10px;
  font-size:11.5px;min-width:140px;z-index:5}
.tip.on{opacity:1}
.tip h4{margin:0 0 4px;font-size:11.5px;font-weight:600}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between;line-height:1.7}
.tip .r i{width:7px;height:7px;border-radius:1px;background:var(--c);flex:none}
.tip .r span{flex:1;color:var(--ink-3)}
.tip .r b{font-weight:500;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:3px 16px;padding:0 14px 12px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:1px;vertical-align:middle;
  margin-right:6px;background:var(--c)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 14px;
  border-bottom:1px solid var(--line);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{padding:4px 11px;border:0;border-left:1px solid var(--line);background:none;
  color:var(--ink-3);font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.tone button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);
  box-shadow:inset 0 -2px 0 var(--c)}
.seg .d2{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);
  margin-right:6px;vertical-align:middle}
#q,#sort{padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);
  color:var(--ink);font:inherit;font-size:11.5px}
#q{flex:1;min-width:130px}
#q::placeholder{color:var(--ink-3)}
#copy{border:1px solid var(--line);border-radius:4px;background:none;color:var(--ink-3);
  font:inherit;font-size:11.5px;padding:4px 10px;cursor:pointer}
#copy:hover{border-color:var(--line-2);color:var(--ink)}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;
  border-bottom:1px solid var(--line);background:var(--sunken);font-size:11.5px}
.fbar .lbl{color:var(--ink-3)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line-2);
  border-radius:99px;color:var(--ink);background:var(--bg);font:inherit;font-size:11.5px;cursor:pointer}
.fchip:hover{border-color:var(--ink)}
.fchip i{font-style:normal;color:var(--ink-3)}
.fclear{margin-left:auto;border:0;background:none;color:var(--ink-3);font:inherit;
  font-size:11.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.fclear:hover{color:var(--ink)}

/* table */
.scroll{overflow:auto;max-height:min(58vh,560px)}
.thead,.item{display:grid;
  grid-template-columns:34px minmax(150px,2.2fr) 44px minmax(88px,1fr) 62px 78px 34px 62px;
  gap:12px;align-items:center;padding:0 14px}
.thead{position:sticky;top:0;z-index:2;height:28px;border-bottom:1px solid var(--line);
  background:var(--panel);font-size:10.5px;color:var(--ink-3)}
.thead span:nth-child(n+7){text-align:right}
.item{height:32px;width:100%;border:0;border-top:1px solid var(--line);background:none;
  color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:first-of-type{border-top:0}
.item:hover{background:var(--sunken)}
.item.sel{background:var(--sunken);box-shadow:inset 2px 0 0 var(--ink)}
.id{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:500;font-size:13px}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{flex:none;font-size:9.5px;font-weight:500;color:var(--ink-3);border:1px solid var(--line);
  border-radius:3px;padding:0 3px}
.vt,.win,.left,.pr{font-size:11.5px;font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;color:var(--ink-2)}
.left,.pr{text-align:right}
.pr{color:var(--ink);font-weight:500}
.rg{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11.5px;color:var(--c);white-space:nowrap}
.empty{padding:24px 14px;color:var(--ink-3);font-size:12.5px}

/* timeline */
.tl-scroll{overflow:auto;max-height:min(58vh,560px);padding:12px 14px}
.tl{min-width:640px;--gutter:26px;--lane:184px}
.tl-axis{position:relative;height:15px;margin-left:var(--lane);margin-right:var(--gutter);
  font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-body{position:relative}
.tl-grid{position:absolute;inset:0 var(--gutter) 0 var(--lane);pointer-events:none}
.tl-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-now{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.55}
.tl-now::after{content:"오늘";position:absolute;top:-15px;left:4px;font-size:10px;
  color:var(--ink-2);white-space:nowrap}
.row{display:grid;grid-template-columns:var(--lane) 1fr;align-items:center;height:20px}
.rname{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:10px}
.rname em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.track{position:relative;height:100%;margin-right:var(--gutter)}
.bar2{position:absolute;top:6px;height:8px;border-radius:1px;cursor:pointer;
  background:color-mix(in srgb,var(--c) 22%,transparent);border-left:2px solid var(--c)}
.bar2:hover{background:color-mix(in srgb,var(--c) 45%,transparent)}
.bar2.sel{outline:1px solid var(--ink);outline-offset:1px}

/* bottom */
.pad{padding:12px 14px;overflow:auto;max-height:340px}
.mixrow{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  font-size:12.3px;margin-bottom:8px;cursor:pointer}
.mixrow em{font-style:normal;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mixrow b{font-weight:500;font-size:11px;color:var(--ink-2);min-width:44px;text-align:right;
  font-variant-numeric:tabular-nums}
.mixrow .t2{grid-column:1/-1;height:3px;background:var(--sunken);overflow:hidden;border-radius:2px}
.mixrow .t2 i{display:block;height:100%;background:var(--ink-3)}
.mixrow:hover span:first-child{color:var(--ink)}
.mixrow.on .t2 i{background:var(--ink)}
.mixrow.on span:first-child{font-weight:600}
.vbar{cursor:pointer}
.vcap{font-size:10.5px;color:var(--ink-3);margin-top:6px;line-height:1.6}
.gi{padding:10px 0;border-top:1px solid var(--line)}
.gi:first-child{border-top:0;padding-top:0}
.gi h3{font-size:12.8px;display:flex;align-items:baseline;gap:7px}
.gi .pri{font-size:10.5px;color:var(--red);font-weight:500}
.gi p{margin:3px 0 6px;font-size:11.8px;color:var(--ink-3)}
.picks{display:flex;flex-wrap:wrap;gap:5px}
.picks span{font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:3px;color:var(--ink-2)}
.gi h3 em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
footer{padding:0 20px 28px;font-size:11px;color:var(--ink-3);line-height:1.8;max-width:100ch}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;
  transition:opacity .16s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--bg);
  border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(101%);
  transition:transform .2s cubic-bezier(.4,0,.2,1);overflow-y:auto;overscroll-behavior:contain}
#drawer.on{transform:none}
.dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:16px 20px 13px;display:grid;gap:5px}
.dh .code{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dh h2{font-size:18px;line-height:1.3;letter-spacing:-.015em}
.dsub{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-3)}
#close{position:absolute;top:13px;right:13px;width:24px;height:24px;border:1px solid var(--line);
  border-radius:4px;background:var(--bg);color:var(--ink-3);font-size:11px;cursor:pointer}
#close:hover{border-color:var(--ink);color:var(--ink)}
.db{padding:16px 20px 36px;display:grid;gap:17px}
.dprice{display:grid;gap:5px;padding:12px 13px;border:1px solid var(--line);border-radius:4px}
.dprice .amt{display:flex;align-items:baseline;gap:7px}
.dprice .amt b{font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.dprice .amt span,.dprice .cf{font-size:11px;color:var(--ink-3)}
.dprice .krw{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dprice .cf b{font-weight:600;color:var(--ink-2)}
.ws{display:inline-flex;justify-self:start;font-size:11.5px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:4px 10px;margin-top:3px}
.ws:hover{border-color:var(--ink)}
.blk h3{margin:0 0 5px;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.blk p{margin:0;font-size:12.8px;color:var(--ink-2);line-height:1.65}
.blk p.lead{color:var(--ink)}
.serve{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:0}
.serve div{padding:9px 10px;background:var(--panel)}
.serve dt{font-size:10.5px;color:var(--ink-3);margin-bottom:2px}
.serve dd{margin:0;font-size:12px;font-weight:500;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:11.5px;padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--ink-2)}
.dwin{display:grid;gap:5px}
.dwin .ba{position:relative;height:6px;background:var(--sunken);border-radius:3px}
.dwin .fill{position:absolute;top:0;bottom:0;background:var(--c);opacity:.75;border-radius:3px}
.dwin .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.dwin .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.peers{display:flex;flex-wrap:wrap;gap:5px}
.peers button{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;
  background:none;color:var(--ink-2);font-family:inherit;cursor:pointer}
.peers button:hover{border-color:var(--ink);color:var(--ink)}
.dmeta{display:grid;gap:4px;font-size:11.8px;color:var(--ink-3)}
.dmeta div{display:grid;grid-template-columns:66px 1fr;gap:9px}
.dmeta b{font-weight:400;font-size:11px}

@media (max-width:760px){
  .thead{display:none}
  .item{grid-template-columns:32px 1fr 62px;height:auto;padding-block:8px;row-gap:2px}
  .rg,.vt,.win,.left{display:none}.st{grid-column:2}.pr{grid-column:3;justify-self:end}
  .serve{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>CellarOS</h1>
  <span class="meta" id="meta"></span>
  <span class="keys"><b>/</b>검색 <b>J K</b>이동 <b>↵</b>열기 <b>C</b>해제</span>
</header>

<div class="wrap">
  <dl class="sum" id="sum"></dl>

  <div class="two wide">
    <div class="p"><div class="ph"><h2>해석</h2><span class="r" id="ins-n"></span></div>
      <div id="insights"></div></div>
    <div class="p"><div class="ph"><h2>지표</h2><span class="r">클릭하면 해당 병만</span></div>
      <div id="facts"></div></div>
  </div>

  <div class="two">
    <div class="p"><div class="ph"><h2>가치 × 잔여 기간</h2><span class="r" id="mx-sub"></span></div>
      <div class="plot" id="mx"><div class="tip" id="mx-tip"></div></div>
      <div class="legend" id="mx-legend"></div></div>
    <div class="p"><div class="ph"><h2>성숙</h2><span class="r" id="cv-sub"></span></div>
      <div class="plot" id="cv"><div class="tip" id="cv-tip"></div></div>
      <div class="legend" id="cv-legend"></div></div>
  </div>

  <div class="p">
    <div class="ph"><h2>인벤토리</h2><span class="r" id="count"></span></div>
    <div class="bar">
      <div class="seg" id="view">
        <button data-v="table" aria-pressed="true">표</button>
        <button data-v="time" aria-pressed="false">타임라인</button></div>
      <div class="seg" id="presets"></div>
      <div class="seg tone" id="tones"></div>
      <input id="q" type="search" placeholder="검색" autocomplete="off">
      <select id="sort" aria-label="정렬">
        <option value="close">마감순</option><option value="price">가격순</option>
        <option value="vintage">빈티지순</option><option value="name">이름순</option></select>
      <button id="copy" title="현재 목록을 CSV로 복사">복사</button>
    </div>
    <div class="fbar" id="fbar" hidden></div>
    <div id="table-view" class="scroll">
      <div class="thead"><span>ID</span><span>와인</span><span>빈티지</span><span>지역</span>
        <span>상태</span><span>음용 창</span><span>잔여</span><span>가치</span></div>
      <div id="rows"></div></div>
    <div id="time-view" class="tl-scroll" hidden><div class="tl" id="tl"></div></div>
  </div>

  <div class="three">
    <div class="p"><div class="ph"><h2>구성</h2><span class="r">
      <span class="seg" id="facet" style="display:inline-flex;vertical-align:middle">
        <button data-f="category" aria-pressed="true">지역</button>
        <button data-f="vintage" aria-pressed="false">빈티지</button>
        <button data-f="grape" aria-pressed="false">품종</button></span></span></div>
      <div class="pad" id="mix"></div></div>
    <div class="p"><div class="ph"><h2>공백</h2></div><div class="pad" id="gaps"></div></div>
    <div class="p"><div class="ph"><h2>확인할 것</h2></div><div class="pad" id="flags"></div></div>
  </div>
</div>
<footer id="foot"></footer>

<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <button id="close" aria-label="닫기">✕</button>
  <div id="drawer-inner"></div>
</aside>

<script>
const DATA=/*__DATA__*/, YEAR=+DATA.updated.slice(0,4), ST=DATA.stats;
const KRW=1380, KR_MULT=1.7;
/* 상태는 세 단계로만 색을 쓴다 — 붉은색은 창이 닫히는 중, 초록은 지금이 정점, 나머지는 무채색. */
const TONE={act:{label:"소진",c:"--red",of:["urgent","drink_now"]},
  prime:{label:"정점",c:"--green",of:["peak"]},
  hold:{label:"대기",c:"--ink-3",of:["drink_or_hold","hold"]}};
const LABEL={urgent:"임박",drink_now:"지금",peak:"정점",drink_or_hold:"음용·대기",hold:"대기"};
const TONES=["act","prime","hold"];
const toneOf=b=>TONES.find(t=>TONE[t].of.includes(b.status));
const cvar=b=>`var(${TONE[toneOf(b)].c})`;
const CONF={high:"높음",medium:"보통",low:"낮음",none:"없음"};
const B=[...DATA.bottles], byId=Object.fromEntries(B.map(b=>[b.id,b]));
const qty=b=>b.qty??1, vint=b=>b.vintage?String(b.vintage):(b.vintage_label||"NV");
const value=b=>b.price.avg_usd*(b.format_ml===375?.5:1)*qty(b);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=n=>"$"+Math.round(n).toLocaleString();
const won=u=>Math.round(u*KRW*KR_MULT/1000)*1000;
const code=b=>String(b.id).padStart(2,"0");
const ready=b=>b.drink_from<=YEAR&&b.drink_to>=YEAR&&b.status!=="hold";
const left=b=>b.drink_to-YEAR;
const grape=b=>(b.grapes&&b.grapes[0])||"—";
const NS="http://www.w3.org/2000/svg";
const svg=(w,h)=>{const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("role","img");return s};
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const $=id=>document.getElementById(id);

/* state */
const PRESETS=[{k:"all",label:"전체",fn:()=>true},{k:"now",label:"지금",fn:ready},
  {k:"soon",label:"3년",fn:b=>left(b)<=3},{k:"top",label:"$300+",fn:b=>b.price.avg_usd>=300},
  {k:"white",label:"화이트",fn:b=>b.type.includes("white")}];
const F={preset:"all",tone:new Set(),q:"",quad:null,facet:null,pick:null};
let view="table", sortKey="close", selId=null, curList=[], facetAxis="category";
const save=()=>{try{localStorage.setItem("cellaros",JSON.stringify({preset:F.preset,
  tone:[...F.tone],quad:F.quad,view,sort:sortKey,facetAxis}))}catch(e){}};
(function(){try{const j=JSON.parse(localStorage.getItem("cellaros")||"{}");
  if(PRESETS.some(p=>p.k===j.preset))F.preset=j.preset;
  if(Array.isArray(j.tone))j.tone.filter(t=>TONE[t]).forEach(t=>F.tone.add(t));
  if(j.quad)F.quad=j.quad;
  if(j.view==="time"||j.view==="table")view=j.view;
  if(j.sort)sortKey=j.sort; if(j.facetAxis)facetAxis=j.facetAxis}catch(e){}})();

/* header + summary */
const yrs=B.filter(b=>b.vintage).map(b=>b.vintage);
$("meta").innerHTML=`<b>${ST.total}</b>병 · <b>${ST.kinds}</b>종 · <b>${usd(ST.worth)}</b>
  · ${Math.min(...yrs)}–${Math.max(...yrs)} · 셀러 ${DATA.storage.temp_c}°C · ${DATA.updated} 기준`;
const cnt=t=>B.filter(b=>toneOf(b)===t).reduce((s,b)=>s+qty(b),0);
$("sum").innerHTML=[
  ["보유",`${ST.total}<small>병</small>`],["추정 가치",usd(ST.worth)],
  ["소진 구간",`${cnt("act")}<small>병</small>`],["정점",`${cnt("prime")}<small>병</small>`],
  ["대기",`${cnt("hold")}<small>병</small>`],
  ["잔여 중앙값",`${ST.median_years}<small>년</small>`],
].map(([t,v])=>`<div><dt>${t}</dt><dd class="n">${v}</dd></div>`).join("");

/* insights + facts */
$("ins-n").textContent=DATA.insights.length+"건";
$("insights").innerHTML=DATA.insights.map((i,n)=>`
  <button class="ins" data-ins="${n}">
    <span class="top"><span class="kick${i.act?" act":""}">${esc(i.kicker)}</span>
      <h3>${esc(i.head)}</h3></span>
    <p>${esc(i.detail)}</p></button>`).join("");
$("facts").innerHTML=DATA.facts.map((f,n)=>
  f.ids.length
    ? `<button class="fact hit" data-fact="${n}"><span class="k">${esc(f.label)}</span>
        <span class="v">${esc(f.value)}</span></button>`
    : `<div class="fact"><span class="k">${esc(f.label)}</span>
        <span class="v">${esc(f.value)}</span></div>`).join("");
const pickFrom=(kind,n)=>{
  const same=F.pick&&F.pick.kind===kind&&F.pick.n===n;
  F.pick=same?null:{kind,n,ids:(kind==="ins"?DATA.insights:DATA.facts)[n].ids,
    label:(kind==="ins"?DATA.insights[n].head:DATA.facts[n].label)};
  render()};
$("insights").addEventListener("click",e=>{const b=e.target.closest("[data-ins]");
  if(b)pickFrom("ins",+b.dataset.ins)});
$("facts").addEventListener("click",e=>{const b=e.target.closest("[data-fact]");
  if(b)pickFrom("fact",+b.dataset.fact)});

/* value × remaining */
const QUAD={risk:{label:"위험",fn:(v,t)=>v>=ST.median_value&&t<ST.median_years},
  asset:{label:"자산",fn:(v,t)=>v>=ST.median_value&&t>=ST.median_years},
  drink:{label:"소비",fn:(v,t)=>v<ST.median_value&&t<ST.median_years},
  wait:{label:"대기",fn:(v,t)=>v<ST.median_value&&t>=ST.median_years}};
const dotById={};
(function(){
  const W=520,H=290,m={t:18,r:14,b:28,l:44};
  const XM=Math.max(...B.map(left)), YM=Math.max(...B.map(b=>b.price.avg_usd));
  const px=v=>m.l+v/XM*(W-m.l-m.r), py=v=>H-m.b-v/YM*(H-m.t-m.b);
  const s=svg(W,H);
  s.setAttribute("aria-label","가로축 남은 음용 연수, 세로축 병당 가치. 중앙값 두 선으로 네 구역을 나눈다.");
  [0,200,400,600].forEach(v=>{
    s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:py(v),y2:py(v),class:"gridline"}));
    s.appendChild(el("text",{x:m.l-7,y:py(v)+3.5,"text-anchor":"end",class:"axis"})).textContent="$"+v});
  [0,5,10,15,20,25].filter(v=>v<=XM).forEach(v=>
    s.appendChild(el("text",{x:px(v),y:H-m.b+14,"text-anchor":"middle",class:"axis"})).textContent=v+"년");
  const qx=px(ST.median_years), qy=py(ST.median_value);
  [["risk",m.l,m.t,qx-m.l,qy-m.t],["asset",qx,m.t,W-m.r-qx,qy-m.t],
   ["drink",m.l,qy,qx-m.l,H-m.b-qy],["wait",qx,qy,W-m.r-qx,H-m.b-qy]].forEach(([k,x,y,w,h])=>{
    const r=el("rect",{x,y,width:Math.max(w,0),height:Math.max(h,0),class:"quadhit","data-quad":k});
    r.addEventListener("click",()=>{F.quad=F.quad===k?null:k;render()}); s.appendChild(r)});
  s.appendChild(el("line",{x1:qx,x2:qx,y1:m.t,y2:H-m.b,class:"quadline"}));
  s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:qy,y2:qy,class:"quadline"}));
  [["비싸고 시간 없음",m.l+7,m.t+10,"start"],["비싸고 여유 있음",W-m.r-5,m.t+10,"end"],
   ["부담 없이",m.l+7,qy+14,"start"],["묵혀도 되는",W-m.r-5,qy+14,"end"]]
   .forEach(([t,x,y,a])=>s.appendChild(el("text",{x,y,"text-anchor":a,class:"qlabel"})).textContent=t);
  const box=$("mx"), tip=$("mx-tip");
  [...B].sort((a,b)=>b.price.avg_usd-a.price.avg_usd).forEach(b=>{
    const c=el("circle",{cx:px(left(b)),cy:py(b.price.avg_usd),r:qty(b)>1?6:4.5,
      fill:cvar(b),"fill-opacity":.9,class:"dot","data-id":b.id});
    c.addEventListener("mouseenter",()=>{
      tip.innerHTML=`<h4>${esc(b.display)} ${vint(b)}</h4>
        <div class="r"><span>가치</span><b>${usd(b.price.avg_usd)}</b></div>
        <div class="r"><span>잔여</span><b>${left(b)}년</b></div>
        <div class="r" style="--c:${cvar(b)}"><i></i><span>상태</span><b>${LABEL[b.status]}</b></div>`;
      tip.classList.add("on");
      const r=box.getBoundingClientRect(), sc=W/(r.width-28);
      tip.style.left=Math.min(Math.max(px(left(b))/sc-70,2),Math.max(r.width-170,2))+"px";
      tip.style.top=Math.max(py(b.price.avg_usd)/sc-70,2)+"px"});
    c.addEventListener("mouseleave",()=>tip.classList.remove("on"));
    dotById[b.id]=c; s.appendChild(c)});
  box.insertBefore(s,tip);
})();
$("mx-sub").textContent=`중앙값 ${usd(ST.median_value)} · ${ST.median_years}년`;
$("mx-legend").innerHTML=TONES.map(t=>
  `<span style="--c:var(${TONE[t].c})"><i></i>${TONE[t].label}</span>`).join("")
  +`<span style="color:var(--ink-3)">구역을 누르면 그 구역만</span>`;

/* maturity */
const LAST=Math.max(...B.map(b=>b.drink_to)), TOT=ST.total, curve=[];
for(let y=YEAR;y<=LAST;y++){let p=0,r=0,h=0;
  B.forEach(b=>{const n=qty(b); if(b.drink_to<y)p+=n; else if(b.drink_from<=y)r+=n; else h+=n});
  curve.push({y,past:p,rdy:r,hold:h})}
const BANDS=[{k:"past",label:"창 닫힘",c:"var(--b-past)"},{k:"rdy",label:"마실 수 있음",c:"var(--b-ready)"},
  {k:"hold",label:"아직 잠김",c:"var(--b-hold)"}];
(function(){
  const W=520,H=290,m={t:16,r:74,b:28,l:28};
  const px=y=>m.l+(y-YEAR)/(LAST-YEAR)*(W-m.l-m.r), py=v=>m.t+(1-v/TOT)*(H-m.t-m.b);
  const s=svg(W,H);
  s.setAttribute("aria-label",`${YEAR}년부터 ${LAST}년까지 ${TOT}병이 잠김·음용 가능·마감으로 나뉘는 추이`);
  [0,Math.round(TOT/2),TOT].forEach(v=>{
    s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:py(v),y2:py(v),class:"gridline"}));
    s.appendChild(el("text",{x:m.l-7,y:py(v)+3.5,"text-anchor":"end",class:"axis"})).textContent=v});
  for(let y=Math.ceil(YEAR/10)*10;y<=LAST;y+=10)
    s.appendChild(el("text",{x:px(y),y:H-m.b+14,"text-anchor":"middle",class:"axis"})).textContent=y;
  let base=curve.map(()=>0);
  BANDS.forEach(bd=>{
    const top=curve.map((d,i)=>base[i]+d[bd.k]);
    s.appendChild(el("polygon",{class:"band",fill:bd.c,
      points:curve.map((d,i)=>`${px(d.y)},${py(top[i])}`).join(" ")+" "+
             curve.map((d,i)=>`${px(d.y)},${py(base[i])}`).reverse().join(" ")}));
    const n=curve.length-1;
    if(top[n]-base[n]>0) s.appendChild(el("text",{x:W-m.r+7,y:py((base[n]+top[n])/2),
      class:"dlabel",fill:bd.k==="rdy"?bd.c:"var(--ink-2)"}))
      .textContent=`${bd.label} ${top[n]-base[n]}`;
    base=top});
  const cross=el("line",{y1:m.t,y2:H-m.b,class:"cross",opacity:0}); s.appendChild(cross);
  const hit=el("rect",{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:"transparent"});
  s.appendChild(hit);
  const box=$("cv"), tip=$("cv-tip"); box.insertBefore(s,tip);
  hit.addEventListener("mousemove",ev=>{
    const r=box.getBoundingClientRect(), sc=W/(r.width-28);
    const i=Math.max(0,Math.min(curve.length-1,
      Math.round(((ev.clientX-r.left-14)*sc-m.l)/((W-m.l-m.r)/(curve.length-1)))));
    const d=curve[i];
    cross.setAttribute("x1",px(d.y));cross.setAttribute("x2",px(d.y));cross.setAttribute("opacity",1);
    tip.innerHTML=`<h4>${d.y}년</h4>`+BANDS.map(b=>
      `<div class="r" style="--c:${b.c}"><i></i><span>${b.label}</span><b>${d[b.k]}</b></div>`).join("");
    tip.classList.add("on");
    tip.style.left=Math.min(Math.max(px(d.y)/sc-74,2),Math.max(r.width-180,2))+"px";tip.style.top="2px"});
  hit.addEventListener("mouseleave",()=>{tip.classList.remove("on");cross.setAttribute("opacity",0)});
})();
const c5=curve.find(d=>d.y===YEAR+5)||curve[curve.length-1];
$("cv-sub").textContent=`지금 ${curve[0].rdy}병 · ${YEAR+5}년 ${c5.rdy}병`;
$("cv-legend").innerHTML=BANDS.map(b=>`<span style="--c:${b.c}"><i></i>${b.label}</span>`).join("");

/* facets */
const lo=Math.min(...B.map(b=>b.drink_from)), hi=Math.max(...B.map(b=>b.drink_to));
const pct=y=>(y-lo)/(hi-lo)*100;
const short0=b=>b.display.replace(/^Château /,"").split(" ").slice(0,2).join(" ");
function renderFacet(){
  const host=$("mix");
  if(facetAxis==="vintage"){
    const vs=B.filter(b=>b.vintage), V0=1995, V1=2024;
    const older=vs.filter(b=>b.vintage<V0);
    const c={}; vs.filter(b=>b.vintage>=V0).forEach(b=>c[b.vintage]=(c[b.vintage]||0)+qty(b));
    const n=V1-V0+1, W=380,H=118,m={t:8,r:4,b:18,l:16}, slot=(W-m.l-m.r)/n;
    const mx=Math.max(...Object.values(c));
    const s=svg(W,H);
    s.setAttribute("aria-label","빈티지별 보유 병 수. 막대가 없는 해가 공백이다.");
    [0,mx].forEach(v=>{const y=m.t+(1-v/mx)*(H-m.t-m.b);
      s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:y,y2:y,class:"gridline"}));
      s.appendChild(el("text",{x:m.l-4,y:y+3,"text-anchor":"end",class:"axis"})).textContent=v});
    for(let y=2000;y<=V1;y+=10)
      s.appendChild(el("text",{x:m.l+(y-V0+.5)*slot,y:H-m.b+12,"text-anchor":"middle",class:"axis"}))
        .textContent=y;
    for(let y=V0;y<=V1;y++){
      const v=c[y]||0, x=m.l+(y-V0)*slot, on=F.facet&&F.facet.type==="vintage"&&F.facet.value===y;
      const g=el("g",{class:v?"vbar":""});
      const bh=v/mx*(H-m.t-m.b);
      g.appendChild(el("rect",{x:x+slot*.14,y:H-m.b-bh,width:Math.max(slot*.72,1.6),height:bh,
        fill:on?"var(--ink)":"var(--ink-3)","fill-opacity":v?(on?1:.75):0}));
      g.appendChild(el("rect",{x,y:m.t,width:slot,height:H-m.t-m.b,fill:"transparent"}));
      g.appendChild(el("title")).textContent=`${y} · ${v}병`;
      if(v)g.addEventListener("click",()=>{F.facet=on?null:{type:"vintage",value:y};render()});
      s.appendChild(g)}
    host.innerHTML=""; host.appendChild(s);
    const gap=[]; for(let y=1996;y<=2022;y++) if(!c[y])gap.push(y);
    const cap=document.createElement("div"); cap.className="vcap";
    cap.textContent=(older.length?older.map(b=>`${b.vintage} ${short0(b)}`).join(" · ")+" · ":"")
      +"없는 해 "+gap.join(" · ");
    host.appendChild(cap); return;
  }
  const agg={};
  B.forEach(b=>{const k=facetAxis==="category"?b.category:grape(b);
    const a=agg[k]||(agg[k]=[0,0]); a[0]+=qty(b); a[1]+=value(b)});
  const mm=Math.max(...Object.values(agg).map(v=>v[1]));
  host.innerHTML=Object.entries(agg).sort((a,b)=>b[1][1]-a[1][1]).map(([k,[n,v]])=>{
    const on=F.facet&&F.facet.type===facetAxis&&F.facet.value===k;
    return `<div class="mixrow${on?" on":""}" data-facet="${esc(k)}"><span>${esc(k)}</span>
      <em>${n}병</em><b>${usd(v)}</b>
      <span class="t2"><i style="width:${v/mm*100}%"></i></span></div>`}).join("");
}
$("facet").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return;
  facetAxis=b.dataset.f;
  [...e.currentTarget.children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===facetAxis));
  F.facet=null; save(); render()});
$("mix").addEventListener("click",e=>{const d=e.target.closest("[data-facet]"); if(!d)return;
  const v=d.dataset.facet;
  F.facet=(F.facet&&F.facet.type===facetAxis&&F.facet.value===v)?null:{type:facetAxis,value:v};
  render()});

/* inventory */
$("presets").innerHTML=PRESETS.map(p=>
  `<button data-p="${p.k}" aria-pressed="${p.k===F.preset}">${p.label}</button>`).join("");
$("tones").innerHTML=TONES.map(t=>
  `<button data-t="${t}" aria-pressed="${F.tone.has(t)}" style="--c:var(${TONE[t].c})"
   ><i class="d2"></i>${TONE[t].label} ${cnt(t)}</button>`).join("");
$("sort").value=sortKey;
[...$("facet").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===facetAxis));
const SORTS={close:(a,b)=>a.drink_to-b.drink_to||a.id-b.id,
  price:(a,b)=>b.price.avg_usd-a.price.avg_usd,
  vintage:(a,b)=>(a.vintage||9999)-(b.vintage||9999),
  name:(a,b)=>a.display.localeCompare(b.display)};
function passes(b){
  if(!PRESETS.find(p=>p.k===F.preset).fn(b))return false;
  if(F.tone.size&&!F.tone.has(toneOf(b)))return false;
  if(F.quad&&!QUAD[F.quad].fn(b.price.avg_usd,left(b)))return false;
  if(F.facet){
    if(F.facet.type==="category"&&b.category!==F.facet.value)return false;
    if(F.facet.type==="grape"&&grape(b)!==F.facet.value)return false;
    if(F.facet.type==="vintage"&&b.vintage!==F.facet.value)return false}
  if(F.pick&&!F.pick.ids.includes(b.id))return false;
  const t=F.q.trim().toLowerCase();
  if(t&&![b.display,b.producer,b.region,b.category,vint(b),code(b),...(b.grapes||[])]
    .join(" ").toLowerCase().includes(t))return false;
  return true}
function rows(list){
  const t=$("rows");
  if(!list.length){t.innerHTML=`<p class="empty">해당하는 병이 없습니다</p>`;return}
  t.innerHTML=list.map(b=>`<button class="item${b.id===selId?" sel":""}" data-id="${b.id}">
    <span class="id">${code(b)}</span>
    <span class="nm">${qty(b)>1?`<b>×${qty(b)}</b>`:""}<span>${esc(b.display)}</span></span>
    <span class="vt">${vint(b)}</span><span class="rg">${esc(b.region)}</span>
    <span class="st" style="--c:${cvar(b)}">${LABEL[b.status]}</span>
    <span class="win">${b.drink_from}–${b.drink_to}</span>
    <span class="left">${left(b)}년</span>
    <span class="pr">${usd(b.price.avg_usd)}</span></button>`).join("")}
function timeline(list){
  const ticks=[]; for(let y=Math.ceil(lo/10)*10;y<=hi;y+=10)ticks.push(y);
  $("tl").innerHTML=
    `<div class="tl-axis">${ticks.map(y=>`<span style="left:${pct(y)}%">${y}</span>`).join("")}</div>
     <div class="tl-body"><div class="tl-grid">${ticks.map(y=>`<i style="left:${pct(y)}%"></i>`).join("")}
       <div class="tl-now" style="left:${pct(YEAR)}%"></div></div>
       ${list.map(b=>`<div class="row">
         <div class="rname" title="${esc(b.display)}">${esc(b.display)} <em>${vint(b)}</em></div>
         <div class="track"><a class="bar2${b.id===selId?" sel":""}" href="#" data-id="${b.id}"
           style="--c:${cvar(b)};left:${pct(b.drink_from)}%;
           width:${Math.max(pct(b.drink_to)-pct(b.drink_from),1.2)}%"
           title="${esc(b.display)} ${b.drink_from}–${b.drink_to}"></a></div></div>`).join("")}</div>`}
function fbar(){
  const c=[];
  if(F.preset!=="all")c.push(["preset",PRESETS.find(p=>p.k===F.preset).label]);
  F.tone.forEach(t=>c.push(["tone:"+t,TONE[t].label]));
  if(F.quad)c.push(["quad",QUAD[F.quad].label+" 구역"]);
  if(F.facet)c.push(["facet",F.facet.value]);
  if(F.pick)c.push(["pick",F.pick.label]);
  if(F.q)c.push(["q",`“${F.q}”`]);
  const bar=$("fbar"); bar.hidden=!c.length; if(!c.length)return;
  bar.innerHTML=`<span class="lbl">필터</span>`+
    c.map(([k,l])=>`<button class="fchip" data-clear="${k}">${esc(l)}<i>✕</i></button>`).join("")+
    `<button class="fclear" data-clear="all">모두 해제</button>`}
function render(){
  curList=B.filter(passes).sort(SORTS[sortKey]);
  if(selId&&!curList.some(b=>b.id===selId))selId=null;
  rows(curList); timeline([...curList].sort(SORTS.close)); fbar(); renderFacet();
  const ids=new Set(curList.map(b=>b.id));
  B.forEach(b=>{const d=dotById[b.id]; if(!d)return;
    d.classList.toggle("off",!ids.has(b.id)); d.classList.toggle("sel",b.id===selId)});
  document.querySelectorAll(".quadhit").forEach(r=>r.classList.toggle("on",r.dataset.quad===F.quad));
  document.querySelectorAll("[data-ins]").forEach(a=>
    a.classList.toggle("on",F.pick&&F.pick.kind==="ins"&&F.pick.n===+a.dataset.ins));
  document.querySelectorAll("[data-fact]").forEach(a=>
    a.classList.toggle("on",F.pick&&F.pick.kind==="fact"&&F.pick.n===+a.dataset.fact));
  [...$("presets").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.p===F.preset));
  [...$("tones").children].forEach(c=>c.setAttribute("aria-pressed",F.tone.has(c.dataset.t)));
  $("count").textContent=
    `${curList.reduce((s,b)=>s+qty(b),0)}병 · ${usd(curList.reduce((s,b)=>s+value(b),0))}`;
  save()}
const clearAll=()=>{F.preset="all";F.tone.clear();F.quad=null;F.facet=null;F.pick=null;
  F.q="";$("q").value="";render()};
$("fbar").addEventListener("click",e=>{const b=e.target.closest("[data-clear]"); if(!b)return;
  const k=b.dataset.clear;
  if(k==="all")return clearAll();
  if(k==="preset")F.preset="all"; else if(k.startsWith("tone:"))F.tone.delete(k.slice(5));
  else if(k==="quad")F.quad=null; else if(k==="facet")F.facet=null;
  else if(k==="pick")F.pick=null; else if(k==="q"){F.q="";$("q").value=""}
  render()});
$("presets").addEventListener("click",e=>{const b=e.target.closest("button");
  if(b){F.preset=b.dataset.p;render()}});
$("tones").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return;
  const t=b.dataset.t; F.tone.has(t)?F.tone.delete(t):F.tone.add(t); render()});
function setView(v){view=v;
  [...$("view").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===view));
  $("table-view").hidden=view!=="table"; $("time-view").hidden=view!=="time"; save()}
$("view").addEventListener("click",e=>{const b=e.target.closest("button"); if(b)setView(b.dataset.v)});
$("q").addEventListener("input",e=>{F.q=e.target.value;render()});
$("sort").addEventListener("change",e=>{sortKey=e.target.value;render()});
$("copy").addEventListener("click",async()=>{
  const csv=["id,wine,vintage,region,status,from,to,qty,usd",
    ...curList.map(b=>[code(b),`"${b.display}"`,vint(b),`"${b.region}"`,LABEL[b.status],
      b.drink_from,b.drink_to,qty(b),b.price.avg_usd].join(","))].join("\n");
  let ok=false;
  try{await navigator.clipboard.writeText(csv);ok=true}catch(e){
    try{const ta=document.createElement("textarea");ta.value=csv;ta.style.cssText="position:fixed;opacity:0";
      document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(e2){}}
  $("copy").textContent=ok?"복사됨":"복사 실패";
  setTimeout(()=>{$("copy").textContent="복사"},1400)});

/* gaps · flags */
$("gaps").innerHTML=DATA.gaps.map(g=>`<div class="gi">
  <h3>${esc(g.title)}${g.severity==="high"?'<span class="pri">우선</span>':""}</h3>
  <p>${esc(g.why.split(".")[0])}.</p>
  <div class="picks">${g.picks.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`).join("");
$("flags").innerHTML=(DATA.flags||[]).map(f=>`<div class="gi">
  <h3><em>${code(byId[f.id])}</em>${esc(f.title)}</h3><p>${esc(f.text)}</p></div>`).join("")
  ||`<p class="empty">없음</p>`;
$("foot").textContent=DATA.price_note+" "+DATA.storage.note;

/* drawer */
const drawer=$("drawer"), scrim=$("scrim");
let lastFocus=null;
function peers(b){
  const pick=k=>B.filter(x=>x.id!==b.id&&k(x));
  const reg=pick(x=>x.region===b.region), gr=pick(x=>grape(x)===grape(b)&&grape(b)!=="—");
  const btn=x=>`<button data-id="${x.id}">${code(x)} ${esc(short0(x))}</button>`;
  let o="";
  if(reg.length)o+=`<div class="blk"><h3>같은 지역</h3><div class="peers">${reg.map(btn).join("")}</div></div>`;
  if(gr.length)o+=`<div class="blk"><h3>같은 품종 · ${esc(grape(b))}</h3><div class="peers">${gr.slice(0,8).map(btn).join("")}</div></div>`;
  return o}
function openDrawer(id){
  const b=byId[id]; if(!b)return; const p=b.profile, pr=b.price;
  const rank=[...B].sort((x,y)=>y.price.avg_usd-x.price.avg_usd).findIndex(x=>x.id===id)+1;
  $("drawer-inner").innerHTML=`
    <div class="dh"><div class="code">${code(b)} · 가치 순위 ${rank}/${B.length}</div>
      <h2 id="d-title">${esc(b.display)}</h2>
      <div class="dsub"><span>${vint(b)}</span><span>${esc(b.region)}</span>
        <span style="color:${cvar(b)}">${LABEL[b.status]}</span>
        <span>${b.drink_from}–${b.drink_to} · 잔여 ${left(b)}년</span></div></div>
    <div class="db">
      <div class="dprice">
        <div class="cf">${pr.confidence==="none"?"참고 추정가 · Wine-Searcher 미등재":"Wine-Searcher 전세계 평균"}</div>
        <div class="amt"><b>${usd(pr.avg_usd)}</b><span>${esc(pr.basis||"750ml ex-tax")}${qty(b)>1?` · ${qty(b)}병`:""}</span></div>
        <div class="krw">≈ ₩${won(pr.avg_usd).toLocaleString()}</div>
        <div class="cf">신뢰도 <b>${CONF[pr.confidence]}</b>${pr.note?` — ${esc(pr.note)}`:""}</div>
        ${pr.verified?`<div class="cf" style="color:var(--green)">확인 — ${esc(pr.verified)}</div>`:""}
        <a class="ws" href="${b.ws_url}" target="_blank" rel="noopener noreferrer">Wine-Searcher ↗</a></div>
      <div class="dwin"><div class="ba">
        <div class="fill" style="--c:${cvar(b)};left:${pct(b.drink_from)}%;
             width:${Math.max(pct(b.drink_to)-pct(b.drink_from),1.5)}%"></div>
        <div class="mark" style="left:${pct(YEAR)}%"></div></div>
        <div class="ends"><span>${lo}</span><span>${hi}</span></div></div>
      <div class="blk"><h3>스타일</h3><p class="lead">${esc(p.style)}</p></div>
      <div class="blk"><h3>시음 노트</h3><p>${esc(p.tasting)}</p></div>
      <div class="blk"><h3>배경</h3><p>${esc(p.story)}</p></div>
      <div class="blk"><h3>서빙</h3><dl class="serve">
        <div><dt>온도</dt><dd>${esc(p.serve.temp)}</dd></div>
        <div><dt>디캔팅</dt><dd>${esc(p.serve.decant)}</dd></div>
        <div><dt>잔</dt><dd>${esc(p.serve.glass)}</dd></div></dl></div>
      <div class="blk"><h3>페어링</h3><div class="tags">${p.pair.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
      <div class="blk"><h3>메모</h3><p>${esc(b.notes)}</p></div>
      ${peers(b)}
      <div class="dmeta">
        <div><b>생산자</b><span>${esc(b.producer)}</span></div>
        ${b.classification?`<div><b>등급</b><span>${esc(b.classification)}</span></div>`:""}
        ${b.grapes?.length?`<div><b>품종</b><span>${b.grapes.map(esc).join(" · ")}</span></div>`:""}
        ${b.abv?`<div><b>도수</b><span>${b.abv}%</span></div>`:""}
        <div><b>용량</b><span>${b.format_ml??750}ml</span></div>
        <div><b>보유</b><span>${qty(b)}병</span></div></div></div>`;
  selId=id; render();
  lastFocus=document.activeElement; drawer.hidden=false;
  requestAnimationFrame(()=>{drawer.classList.add("on");scrim.classList.add("on")});
  drawer.scrollTop=0; $("close").focus()}
function closeDrawer(){drawer.classList.remove("on");scrim.classList.remove("on");
  setTimeout(()=>{drawer.hidden=true},200); lastFocus?.focus()}
scrim.addEventListener("click",closeDrawer);
$("close").addEventListener("click",closeDrawer);
document.addEventListener("click",e=>{const t=e.target.closest("[data-id]");
  if(t){e.preventDefault();openDrawer(+t.dataset.id)}});

/* keyboard */
function moveSel(step){
  if(!curList.length)return;
  const i=curList.findIndex(b=>b.id===selId);
  const n=i<0?(step>0?0:curList.length-1):Math.min(Math.max(i+step,0),curList.length-1);
  selId=curList[n].id; render();
  document.querySelector(`.item[data-id="${selId}"]`)?.scrollIntoView({block:"nearest"})}
document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==="Escape"){if(!drawer.hidden)closeDrawer();else if(typing)document.activeElement.blur();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();$("q").focus();return}
  if(e.key==="j"||e.key==="ArrowDown"){e.preventDefault();moveSel(1);return}
  if(e.key==="k"||e.key==="ArrowUp"){e.preventDefault();moveSel(-1);return}
  if(e.key==="Enter"&&selId){e.preventDefault();openDrawer(selId);return}
  if(e.key==="c"){clearAll();return}
  if(e.key==="t"){setView(view==="table"?"time":"table");return}
  const n=+e.key; if(n>=1&&n<=3){const t=TONES[n-1];
    F.tone.has(t)?F.tone.delete(t):F.tone.add(t);render()}});

setView(view); render();
</script>
