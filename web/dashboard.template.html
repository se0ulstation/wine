<title>셀러 인텔리전스</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECE8EC; --panel:#F9F7F9; --sunken:#E2DCE3; --line:#CFC8D1; --grid:#E1DBE2;
  --tex:rgba(20,16,23,.028);
  --ink:#130F17; --ink-2:#564D5C; --ink-3:#857B8B;
  --cmd:#8A5A0C; --cmd-soft:rgba(138,90,12,.1); --alert:#A93226;
  --s-urgent:#A93226; --s-now:#A9701F; --s-peak:#3F6B46; --s-dh:#2F6A78; --s-hold:#46578A;
  --c-past:#B85708; --c-ready:#00897B; --c-hold:#5344E0;
  --band:.20; --shadow:0 16px 44px rgba(20,16,23,.22);
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A070D; --panel:#110D16; --sunken:#181220; --line:#2A2233; --grid:#1C1624;
  --tex:rgba(232,163,61,.022);
  --ink:#E9E2E9; --ink-2:#948A96; --ink-3:#61586A;
  --cmd:#E8A33D; --cmd-soft:rgba(232,163,61,.12); --alert:#E0705F;
  --s-urgent:#E0705F; --s-now:#D6A353; --s-peak:#7BAE80; --s-dh:#6CB0BE; --s-hold:#8A9BCB;
  --c-past:#D07C1E; --c-ready:#12A892; --c-hold:#8474EE;
  --band:.28; --shadow:0 16px 44px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0A070D; --panel:#110D16; --sunken:#181220; --line:#2A2233; --grid:#1C1624;
  --tex:rgba(232,163,61,.022);
  --ink:#E9E2E9; --ink-2:#948A96; --ink-3:#61586A;
  --cmd:#E8A33D; --cmd-soft:rgba(232,163,61,.12); --alert:#E0705F;
  --s-urgent:#E0705F; --s-now:#D6A353; --s-peak:#7BAE80; --s-dh:#6CB0BE; --s-hold:#8A9BCB;
  --c-past:#D07C1E; --c-ready:#12A892; --c-hold:#8474EE;
  --band:.28; --shadow:0 16px 44px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
     background-image:linear-gradient(var(--tex) 1px,transparent 1px),
                      linear-gradient(90deg,var(--tex) 1px,transparent 1px);
     background-size:26px 26px}
h1,h2,h3{margin:0}
a{color:var(--cmd)}
:focus-visible{outline:1px solid var(--cmd);outline-offset:1px}

/* ── command bar ──────────────────────── */
.cmd{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
     padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--line);
     font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.cmd .brand{font-size:12.5px;font-weight:600;letter-spacing:.22em;color:var(--ink)}
.cmd .sep{width:1px;height:12px;background:var(--line)}
.cmd .f{color:var(--ink-3)}
.cmd .f b{color:var(--ink-2);font-weight:500}
.cmd .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.led{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);
     box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 22%,transparent);vertical-align:middle;
     margin-right:6px;flex:none}
.led.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#clock{color:var(--cmd);font-weight:500}
.kbd b{border:1px solid var(--line);border-radius:2px;padding:0 4px;font-weight:500;color:var(--ink-2)}

/* ── board ────────────────────────────── */
.board{display:grid;gap:10px;padding:10px 14px 24px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:760px){.strip{grid-template-columns:repeat(6,1fr)}}
.grid3{display:grid;gap:10px}
@media (min-width:1080px){.grid3{grid-template-columns:1.28fr 1fr 1fr}}
.grid3b{display:grid;gap:10px}
@media (min-width:860px){.grid3b{grid-template-columns:1fr 1fr 1fr}}

/* ── panel ────────────────────────────── */
.p{position:relative;border:1px solid var(--line);background:var(--panel);
   display:flex;flex-direction:column;min-width:0}
.p::before,.p::after{content:"";position:absolute;width:6px;height:6px;pointer-events:none}
.p::before{top:-1px;left:-1px;border-top:1px solid var(--cmd);border-left:1px solid var(--cmd)}
.p::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--cmd);border-right:1px solid var(--cmd)}
.ph{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);
    background:var(--sunken);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-2);flex:none}
.ph .r{margin-left:auto;letter-spacing:.05em;color:var(--ink-3);text-transform:none;white-space:nowrap}
.pb{flex:1;min-height:0}

/* ── stat cell ────────────────────────── */
.stat{padding:8px 11px}
.stat dt{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--ink-3);margin-bottom:3px}
.stat dd{margin:0;font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.05;
         font-variant-numeric:tabular-nums}
.stat dd small{font-size:9.5px;font-weight:400;color:var(--ink-3);margin-left:2px;letter-spacing:0}

/* ── alerts ───────────────────────────── */
.al{display:grid;grid-template-columns:auto minmax(96px,auto) auto;gap:2px 10px;
    padding:8px 11px;border-top:1px solid var(--line);align-items:baseline}
.al:first-child{border-top:0}
.al .t{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.07em;color:var(--c);
       border:1px solid var(--c);padding:0 4px;justify-self:start;line-height:1.6}
.al .h{font-weight:600;font-size:12.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .v{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink);
       justify-self:end;white-space:nowrap}
.al .d{grid-column:2/-1;font-size:11.3px;color:var(--ink-3);overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap}

/* ── charts ───────────────────────────── */
.plot{position:relative;padding:9px 11px 4px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--ink-3);font-family:var(--mono);font-size:9px}
.band{stroke:var(--panel);stroke-width:2;stroke-linejoin:round}
.dlabel{font-family:var(--mono);font-size:9.5px;font-weight:500;dominant-baseline:middle}
.qlabel{fill:var(--ink-3);font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
        paint-order:stroke fill;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.quadline{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 4;opacity:.45}
.cross{stroke:var(--cmd);stroke-width:1;opacity:.7}
.dot{cursor:pointer;stroke:var(--panel);stroke-width:1.5}
.dot:hover{stroke:var(--ink)}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--bg);
     border:1px solid var(--cmd);box-shadow:var(--shadow);padding:6px 8px;font-size:11px;
     min-width:132px;z-index:5}
.tip.on{opacity:1}
.tip h4{margin:0 0 3px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--cmd)}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between;line-height:1.6}
.tip .r i{width:6px;height:6px;background:var(--c);flex:none}
.tip .r span{flex:1;color:var(--ink-2)}
.tip .r b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;padding:0 11px 9px;font-family:var(--mono);
        font-size:9.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:5px;vertical-align:middle;margin-right:5px;background:var(--c)}

/* ── toolbar ──────────────────────────── */
.bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px 11px;
     border-bottom:1px solid var(--line);flex:none}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:3px 9px;border:0;border-right:1px solid var(--line);background:transparent;
  color:var(--ink-3);font-family:var(--mono);font-size:10px;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--cmd);color:var(--bg)}
.seg.status button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);
  box-shadow:inset 0 -2px 0 var(--c)}
.seg .d2{display:inline-block;width:6px;height:6px;background:var(--c);margin-right:5px;
         vertical-align:middle}
#q,#sort{padding:3px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
   font-family:var(--mono);font-size:10px}
#q{flex:1;min-width:120px}

/* ── table ────────────────────────────── */
.scroll{overflow:auto;max-height:min(56vh,520px)}
.thead,.item{display:grid;
  grid-template-columns:36px minmax(150px,2.1fr) 42px minmax(84px,1fr) 58px 74px 34px 58px;
  gap:9px;align-items:center;padding:0 11px}
.thead{position:sticky;top:0;z-index:2;height:23px;border-bottom:1px solid var(--line);
       background:var(--sunken);font-family:var(--mono);font-size:9px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--ink-3)}
.thead span:nth-child(n+7){text-align:right}
.item{height:27px;width:100%;border:0;border-top:1px solid var(--line);background:none;
      color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:first-of-type{border-top:0}
.item:hover{background:var(--cmd-soft)}
.id{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.nm{display:flex;align-items:center;gap:6px;min-width:0;font-weight:500;font-size:12.4px}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{flex:none;font-family:var(--mono);font-size:8.5px;font-weight:500;color:var(--ink-3);
      border:1px solid var(--line);padding:0 3px}
.vt,.win,.left,.pr{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.left,.pr{text-align:right}
.pr{color:var(--ink)}
.rg{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-family:var(--mono);font-size:9.5px;color:var(--c);white-space:nowrap}
.empty{padding:20px 11px;color:var(--ink-3);font-size:12px}

/* ── timeline ─────────────────────────── */
.tl-scroll{overflow:auto;max-height:min(56vh,520px);padding:9px 11px}
.tl{min-width:620px;--gutter:24px;--lane:172px}
.tl-axis{position:relative;height:13px;margin-left:var(--lane);margin-right:var(--gutter);
         font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-body{position:relative}
.tl-grid{position:absolute;inset:0 var(--gutter) 0 var(--lane);pointer-events:none}
.tl-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.tl-now{position:absolute;top:0;bottom:0;width:1px;background:var(--cmd);opacity:.85}
.tl-now::after{content:"NOW";position:absolute;top:-13px;left:3px;font-family:var(--mono);
               font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--cmd);white-space:nowrap}
.row{display:grid;grid-template-columns:var(--lane) 1fr;align-items:center;height:18px}
.rname{font-size:10.8px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis;padding-right:9px}
.rname em{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--ink-3)}
.track{position:relative;height:100%;margin-right:var(--gutter)}
.bar2{position:absolute;top:5px;height:8px;cursor:pointer;
     background:color-mix(in srgb,var(--c) calc(var(--band)*100%),transparent);
     border-left:2px solid var(--c)}
.bar2::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--c);opacity:.5}
.bar2:hover{background:color-mix(in srgb,var(--c) 45%,transparent)}

/* ── bottom ───────────────────────────── */
.pad{padding:9px 11px;overflow:auto;max-height:320px}
.mix div{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;
         font-size:11.4px;margin-bottom:6px}
.mix em{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--ink-3)}
.mix b{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--ink-2);
       min-width:40px;text-align:right}
.mix .t2{grid-column:1/-1;height:3px;background:var(--sunken);overflow:hidden}
.mix .t2 i{display:block;height:100%;background:var(--cmd);opacity:.8}
.gap-i,.flag{padding:7px 0;border-top:1px solid var(--line)}
.gap-i:first-child,.flag:first-child{border-top:0;padding-top:0}
.gap-i h3,.flag h3{font-size:12.2px;font-weight:600;display:flex;align-items:baseline;gap:6px}
.gap-i .tag{font-family:var(--mono);font-size:9px;padding:0 4px;color:var(--c);border:1px solid var(--c)}
.gap-i p,.flag p{margin:3px 0 5px;font-size:11.3px;color:var(--ink-3)}
.flag p{margin-bottom:0}
.flag h3 em{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--cmd)}
.picks{display:flex;flex-wrap:wrap;gap:4px}
.picks span{font-family:var(--mono);font-size:9.8px;padding:1px 5px;background:var(--sunken);color:var(--ink-2)}
footer{padding:0 14px 8px;font-family:var(--mono);font-size:9.8px;color:var(--ink-3);line-height:1.8}

/* ── panel drawer ─────────────────────── */
#scrim{position:fixed;inset:0;background:rgba(6,4,8,.6);opacity:0;pointer-events:none;
       transition:opacity .16s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--bg);
       border-left:1px solid var(--cmd);box-shadow:var(--shadow);transform:translateX(101%);
       transition:transform .2s cubic-bezier(.4,0,.2,1);overflow-y:auto;overscroll-behavior:contain}
#drawer.on{transform:none}
.d-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
        padding:14px 18px 11px;display:grid;gap:4px}
.d-head .code{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--cmd)}
.d-head h2{font-size:17px;font-weight:600;line-height:1.25}
.d-sub{display:flex;flex-wrap:wrap;gap:3px 11px;font-family:var(--mono);font-size:10.3px;color:var(--ink-3)}
#close{position:absolute;top:11px;right:11px;width:22px;height:22px;border:1px solid var(--line);
       background:var(--bg);color:var(--ink-3);font-size:11px;cursor:pointer}
#close:hover{border-color:var(--cmd);color:var(--ink)}
.d-body{padding:14px 18px 34px;display:grid;gap:15px}
.d-price{display:grid;gap:4px;padding:10px 11px;background:var(--panel);border:1px solid var(--line)}
.d-price .amt{display:flex;align-items:baseline;gap:6px}
.d-price .amt b{font-family:var(--mono);font-weight:600;font-size:22px;line-height:1;
                font-variant-numeric:tabular-nums}
.d-price .amt span,.d-price .cf,.d-price .krw{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.d-price .krw{color:var(--ink-2)}
.d-price .cf b{font-weight:600;color:var(--ink-2)}
.ws{display:inline-flex;justify-self:start;font-family:var(--mono);font-size:10px;
    text-decoration:none;color:var(--cmd);border:1px solid var(--line);padding:3px 8px;margin-top:2px}
.ws:hover{border-color:var(--cmd)}
.blk h3{margin:0 0 4px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.13em;
        text-transform:uppercase;color:var(--ink-3)}
.blk p{margin:0;font-size:12.3px;color:var(--ink-2)}
.blk p.lead{color:var(--ink)}
.serve{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
       border:1px solid var(--line);margin:0}
.serve div{padding:7px 8px;background:var(--panel)}
.serve dt{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-bottom:2px}
.serve dd{margin:0;font-size:11.3px;font-weight:500;line-height:1.38}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;padding:1px 7px;border:1px solid var(--line);color:var(--ink-2)}
.d-win{display:grid;gap:4px}
.d-win .ba{position:relative;height:6px;background:var(--sunken)}
.d-win .fill{position:absolute;top:0;bottom:0;background:var(--c);opacity:.65}
.d-win .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--cmd)}
.d-win .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.d-meta{display:grid;gap:3px;font-size:11.2px;color:var(--ink-3)}
.d-meta div{display:grid;grid-template-columns:62px 1fr;gap:8px}
.d-meta b{font-family:var(--mono);font-weight:400;font-size:9.5px}


/* ── cross-filter ─────────────────────── */
.al{cursor:pointer;user-select:none}
.al:hover{background:var(--cmd-soft)}
.al.on{background:var(--cmd-soft);box-shadow:inset 2px 0 0 var(--cmd)}
.fbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 11px;
      border-bottom:1px solid var(--line);background:var(--sunken);font-family:var(--mono);font-size:10px}
.fbar .lbl{color:var(--ink-3);letter-spacing:.1em}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border:1px solid var(--cmd);
       color:var(--cmd);background:transparent;font:inherit;cursor:pointer}
.fchip:hover{background:var(--cmd-soft)}
.fchip b{font-weight:600}
.fclear{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--ink-3);
        font:inherit;padding:2px 7px;cursor:pointer}
.fclear:hover{border-color:var(--cmd);color:var(--ink)}
.item.sel{background:var(--cmd-soft);box-shadow:inset 2px 0 0 var(--cmd)}
.dot.off{opacity:.13}
.dot.sel{stroke:var(--cmd);stroke-width:2.5}
.quadhit{cursor:pointer;fill:transparent}
.quadhit:hover{fill:var(--cmd);fill-opacity:.05}
.quadhit.on{fill:var(--cmd);fill-opacity:.08}
.bar2.sel{outline:1px solid var(--cmd);outline-offset:1px}
.mix div{cursor:pointer}
.mix div:hover span:first-child{color:var(--ink)}
.mix div.on span:first-child{color:var(--cmd)}
.mix div.on .t2 i{background:var(--cmd);opacity:1}
.vbar{cursor:pointer}
.vbar:hover rect{fill:var(--cmd)}
.peers{display:flex;flex-wrap:wrap;gap:4px}
.peers button{font-family:var(--mono);font-size:9.8px;padding:1px 6px;border:1px solid var(--line);
              background:transparent;color:var(--ink-2);cursor:pointer}
.peers button:hover{border-color:var(--cmd);color:var(--ink)}
#copy{border:1px solid var(--line);background:transparent;color:var(--ink-3);
      font-family:var(--mono);font-size:10px;padding:3px 8px;cursor:pointer}
#copy:hover{border-color:var(--cmd);color:var(--ink)}

@media (max-width:720px){
  .thead{display:none}
  .item{grid-template-columns:32px 1fr 56px;height:auto;padding-block:6px;row-gap:2px}
  .rg,.vt,.win,.left{display:none} .st{grid-column:2} .pr{grid-column:3;justify-self:end}
  .serve{grid-template-columns:1fr}
  .al{grid-template-columns:auto 1fr}
  .al .v{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="cmd">
  <span class="brand">CELLAR</span>
  <span class="sep"></span>
  <span class="f"><i class="led pulse" style="--c:var(--s-peak)"></i>ONLINE</span>
  <span class="f" id="f-sku"></span>
  <span class="f" id="f-val"></span>
  <span class="f" id="f-alert"></span>
  <span class="right">
    <span class="f" id="clock">--:--:--</span>
    <span class="f kbd"><b>/</b> SEARCH <b>J/K</b> MOVE <b>↵</b> OPEN <b>C</b> CLEAR <b>ESC</b></span>
  </span>
</div>

<div class="board">
  <div class="strip" id="strip"></div>

  <div class="grid3">
    <div class="p">
      <div class="ph"><i class="led" style="--c:var(--alert)"></i>Alerts<span class="r" id="al-n"></span></div>
      <div class="pb" id="alerts"></div>
    </div>
    <div class="p">
      <div class="ph">Value × Time<span class="r" id="mx-sub"></span></div>
      <div class="plot" id="mx"><div class="tip" id="mx-tip"></div></div>
      <div class="legend" id="mx-legend"></div>
    </div>
    <div class="p">
      <div class="ph">Maturity<span class="r" id="cv-sub"></span></div>
      <div class="plot" id="cv"><div class="tip" id="cv-tip"></div></div>
      <div class="legend" id="cv-legend"></div>
    </div>
  </div>

  <div class="p">
    <div class="ph">Inventory<span class="r" id="count"></span></div>
    <div class="bar">
      <div class="seg" id="view">
        <button data-v="table" aria-pressed="true">TABLE</button>
        <button data-v="time" aria-pressed="false">TIMELINE</button>
      </div>
      <div class="seg" id="presets"></div>
      <div class="seg status" id="chips"></div>
      <input id="q" type="search" placeholder="SEARCH" autocomplete="off">
      <select id="sort" aria-label="정렬">
        <option value="close">마감순</option><option value="price">가격순</option>
        <option value="vintage">빈티지순</option><option value="name">이름순</option>
      </select>
      <button id="copy" title="현재 목록을 CSV로 복사">COPY</button>
    </div>
    <div class="fbar" id="fbar" hidden></div>
    <div id="table-view" class="scroll">
      <div class="thead"><span>ID</span><span>Wine</span><span>Vint</span><span>Region</span>
        <span>Status</span><span>Window</span><span>Left</span><span>Value</span></div>
      <div id="rows"></div>
    </div>
    <div id="time-view" class="tl-scroll" hidden><div class="tl" id="tl"></div></div>
  </div>

  <div class="grid3b">
    <div class="p"><div class="ph">Mix
        <span class="r"><span class="seg" id="facet" style="display:inline-flex;vertical-align:middle">
          <button data-f="category" aria-pressed="true">지역</button>
          <button data-f="vintage" aria-pressed="false">빈티지</button>
          <button data-f="grape" aria-pressed="false">품종</button></span></span></div>
      <div class="pad" id="mix"></div></div>
    <div class="p"><div class="ph">Gaps</div><div class="pad" id="gaps"></div></div>
    <div class="p"><div class="ph">Flags</div><div class="pad" id="flags"></div></div>
  </div>
</div>
<footer id="foot"></footer>

<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <button id="close" aria-label="닫기">✕</button>
  <div id="drawer-inner"></div>
</aside>

<script>
const DATA=/*__DATA__*/, YEAR=+DATA.updated.slice(0,4), ST=DATA.stats;
const KRW=1380, KR_MULT=1.7;
const S={urgent:{label:"긴급",v:"--s-urgent"},drink_now:{label:"지금",v:"--s-now"},
  peak:{label:"피크",v:"--s-peak"},drink_or_hold:{label:"음용/홀드",v:"--s-dh"},
  hold:{label:"홀드",v:"--s-hold"}};
const ORDER=["urgent","drink_now","peak","drink_or_hold","hold"];
const CONF={high:"높음",medium:"보통",low:"낮음",none:"없음"};
const SEV={high:"--s-urgent",med:"--s-now",low:"--s-dh"};
const QUAD={risk:{label:"위험",fn:(v,t)=>v>=ST.median_value&&t<ST.median_years},
  asset:{label:"자산",fn:(v,t)=>v>=ST.median_value&&t>=ST.median_years},
  drink:{label:"소비",fn:(v,t)=>v<ST.median_value&&t<ST.median_years},
  wait:{label:"대기",fn:(v,t)=>v<ST.median_value&&t>=ST.median_years}};
const B=[...DATA.bottles], byId=Object.fromEntries(B.map(b=>[b.id,b]));
const qty=b=>b.qty??1, vint=b=>b.vintage?String(b.vintage):(b.vintage_label||"NV");
const cvar=b=>`var(${S[b.status].v})`;
const value=b=>b.price.avg_usd*(b.format_ml===375?.5:1)*qty(b);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=n=>"$"+Math.round(n).toLocaleString();
const won=u=>Math.round(u*KRW*KR_MULT/1000)*1000;
const code=b=>"B"+String(b.id).padStart(2,"0");
const ready=b=>b.drink_from<=YEAR&&b.drink_to>=YEAR&&b.status!=="hold";
const left=b=>b.drink_to-YEAR;
const grape=b=>(b.grapes&&b.grapes[0])||"—";
const short0=b=>b.display.replace(/^Château /,"").split(" ").slice(0,2).join(" ");
const NS="http://www.w3.org/2000/svg";
const svg=(w,h)=>{const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("role","img");return s};
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const $=id=>document.getElementById(id);

/* ── state ────────────────────────────── */
const PRESETS=[{k:"all",label:"ALL",fn:()=>true},{k:"now",label:"NOW",fn:ready},
  {k:"soon",label:"3Y",fn:b=>left(b)<=3},{k:"top",label:"$300+",fn:b=>b.price.avg_usd>=300},
  {k:"white",label:"WHITE",fn:b=>b.type!=="red"}];
const F={preset:"all",status:new Set(),q:"",quad:null,facet:null,sig:null};
let view="table", sortKey="close", selId=null, curList=[], facetAxis="category";
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
(function restore(){
  try{const j=JSON.parse(load("cellar.v1")||"{}");
    if(j.preset&&PRESETS.some(p=>p.k===j.preset))F.preset=j.preset;
    if(Array.isArray(j.status))j.status.filter(k=>S[k]).forEach(k=>F.status.add(k));
    if(j.quad&&QUAD[j.quad])F.quad=j.quad;
    if(j.view==="time"||j.view==="table")view=j.view;
    if(j.sort)sortKey=j.sort;
    if(j.facetAxis)facetAxis=j.facetAxis;
  }catch(e){}
})();
const save=()=>store("cellar.v1",JSON.stringify({preset:F.preset,status:[...F.status],
  quad:F.quad,view,sort:sortKey,facetAxis}));

/* ── command bar ──────────────────────── */
const alerts=DATA.insights.filter(i=>i.sev==="high").length;
$("f-sku").innerHTML=`<b>${ST.total}</b> BTL / <b>${ST.kinds}</b> SKU`;
$("f-val").innerHTML=`VAL <b>${usd(ST.worth)}</b>`;
$("f-alert").innerHTML=`<i class="led" style="--c:var(--alert)"></i>ALERT <b>${alerts}</b>`;
const tick=()=>{$("clock").textContent=
  new Date().toTimeString().slice(0,8)+" "+DATA.updated.replace(/-/g,".")};
tick(); setInterval(tick,1000);

/* ── strip ────────────────────────────── */
const held=B.filter(b=>b.status==="hold").reduce((s,b)=>s+qty(b),0);
const soon=B.filter(b=>left(b)<=3).reduce((s,b)=>s+qty(b),0);
const rdyN=B.filter(ready).reduce((s,b)=>s+qty(b),0);
$("strip").innerHTML=[["보유",`${ST.total}<small>BTL</small>`],["가치",usd(ST.worth)],
  ["병당",`${usd(ST.avg)}<small>MED ${usd(ST.median_value)}</small>`],
  ["지금 가능",`${rdyN}<small>BTL</small>`],["3년 내 마감",`${soon}<small>BTL</small>`],
  ["홀드",`${held}<small>BTL</small>`]]
  .map(([t,v])=>`<div class="p"><dl class="stat"><dt>${t}</dt><dd>${v}</dd></dl></div>`).join("");

/* ── alerts (클릭 = 해당 병으로 필터) ──── */
$("al-n").textContent=DATA.insights.length;
$("alerts").innerHTML=DATA.insights.map((i,n)=>`
  <div class="al" data-sig="${n}" role="button" tabindex="0" style="--c:var(${SEV[i.sev]})">
    <span class="t">${esc(i.tag)}</span><span class="h">${esc(i.head)}</span>
    <span class="v">${esc(i.metric)}</span>
    <span class="d" title="${esc(i.detail)}">${esc(i.detail)}</span></div>`).join("");
$("alerts").addEventListener("click",e=>{
  const r=e.target.closest("[data-sig]"); if(!r)return;
  const n=+r.dataset.sig; F.sig=F.sig===n?null:n; render()});
$("alerts").addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const r=e.target.closest("[data-sig]"); if(!r)return;
  e.preventDefault(); const n=+r.dataset.sig; F.sig=F.sig===n?null:n; render()});

/* ── matrix ───────────────────────────── */
const dotById={};
(function(){
  const W=460,H=300,m={t:14,r:12,b:26,l:40};
  const XM=Math.max(...B.map(left)), YM=Math.max(...B.map(b=>b.price.avg_usd));
  const px=v=>m.l+v/XM*(W-m.l-m.r), py=v=>H-m.b-v/YM*(H-m.t-m.b);
  const s=svg(W,H);
  s.setAttribute("aria-label","가로 남은 음용 연수, 세로 병당 가치. 중앙값으로 네 구역을 나눈다. 구역을 누르면 인벤토리가 걸러진다.");
  [0,200,400,600].forEach(v=>{
    s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:py(v),y2:py(v),class:"gridline"}));
    s.appendChild(el("text",{x:m.l-6,y:py(v)+3,"text-anchor":"end",class:"axis"})).textContent="$"+v});
  [0,10,20].filter(v=>v<=XM).forEach(v=>
    s.appendChild(el("text",{x:px(v),y:H-m.b+12,"text-anchor":"middle",class:"axis"})).textContent=v+"y");
  const mx=px(ST.median_years), my=py(ST.median_value);
  [["risk",m.l,m.t,mx-m.l,my-m.t],["asset",mx,m.t,W-m.r-mx,my-m.t],
   ["drink",m.l,my,mx-m.l,H-m.b-my],["wait",mx,my,W-m.r-mx,H-m.b-my]].forEach(([k,x,y,w,h])=>{
    const r=el("rect",{x,y,width:Math.max(w,0),height:Math.max(h,0),class:"quadhit","data-quad":k});
    r.addEventListener("click",()=>{F.quad=F.quad===k?null:k;render()});
    s.appendChild(r)});
  s.appendChild(el("line",{x1:mx,x2:mx,y1:m.t,y2:H-m.b,class:"quadline"}));
  s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:my,y2:my,class:"quadline"}));
  [["위험",m.l+6,m.t+9,"start"],["자산",W-m.r-4,m.t+9,"end"],
   ["소비",m.l+6,H-m.b-11,"start"],["대기",W-m.r-4,H-m.b-11,"end"]].forEach(([t,x,y,a])=>
    s.appendChild(el("text",{x,y,"text-anchor":a,class:"qlabel"})).textContent=t);
  const box=$("mx"), tip=$("mx-tip");
  [...B].sort((a,b)=>b.price.avg_usd-a.price.avg_usd).forEach(b=>{
    const c=el("circle",{cx:px(left(b)),cy:py(b.price.avg_usd),r:qty(b)>1?5.5:4,
      fill:cvar(b),"fill-opacity":.85,class:"dot","data-id":b.id});
    c.addEventListener("mouseenter",()=>{
      tip.innerHTML=`<h4>${esc(b.display)} ${vint(b)}</h4>
        <div class="r"><span>VAL</span><b>${usd(b.price.avg_usd)}</b></div>
        <div class="r"><span>LEFT</span><b>${left(b)}y</b></div>
        <div class="r" style="--c:${cvar(b)}"><i></i><span>ST</span><b>${S[b.status].label}</b></div>`;
      tip.classList.add("on");
      const r=box.getBoundingClientRect(), sc=W/(r.width-22);
      tip.style.left=Math.min(Math.max(px(left(b))/sc-66,2),Math.max(r.width-150,2))+"px";
      tip.style.top=Math.max(py(b.price.avg_usd)/sc-62,2)+"px"});
    c.addEventListener("mouseleave",()=>tip.classList.remove("on"));
    dotById[b.id]=c; s.appendChild(c)});
  box.insertBefore(s,tip);
})();
const risk=B.filter(b=>b.price.avg_usd>=ST.median_value&&left(b)<ST.median_years);
$("mx-sub").textContent=`MED ${usd(ST.median_value)} / ${ST.median_years}y · RISK ${risk.length}`;
$("mx-legend").innerHTML=ORDER.map(k=>
  `<span style="--c:var(${S[k].v})"><i></i>${S[k].label}</span>`).join("")
  +`<span style="color:var(--ink-3)">구역 클릭 = 필터</span>`;

/* ── maturity ─────────────────────────── */
const LAST=Math.max(...B.map(b=>b.drink_to)), TOT=ST.total, curve=[];
for(let y=YEAR;y<=LAST;y++){let p=0,r=0,h=0;
  B.forEach(b=>{const n=qty(b); if(b.drink_to<y)p+=n; else if(b.drink_from<=y)r+=n; else h+=n});
  curve.push({y,past:p,rdy:r,hold:h})}
const BANDS=[{k:"past",label:"마감",c:"var(--c-past)"},{k:"rdy",label:"가능",c:"var(--c-ready)"},
  {k:"hold",label:"잠김",c:"var(--c-hold)"}];
(function(){
  const W=460,H=300,m={t:14,r:52,b:26,l:26};
  const px=y=>m.l+(y-YEAR)/(LAST-YEAR)*(W-m.l-m.r), py=v=>m.t+(1-v/TOT)*(H-m.t-m.b);
  const s=svg(W,H);
  s.setAttribute("aria-label",`${YEAR}년부터 ${LAST}년까지 ${TOT}병의 잠김·가능·마감 추이`);
  [0,Math.round(TOT/2),TOT].forEach(v=>{
    s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:py(v),y2:py(v),class:"gridline"}));
    s.appendChild(el("text",{x:m.l-6,y:py(v)+3,"text-anchor":"end",class:"axis"})).textContent=v});
  for(let y=Math.ceil(YEAR/10)*10;y<=LAST;y+=10)
    s.appendChild(el("text",{x:px(y),y:H-m.b+12,"text-anchor":"middle",class:"axis"})).textContent=y;
  let base=curve.map(()=>0);
  BANDS.forEach(bd=>{
    const top=curve.map((d,i)=>base[i]+d[bd.k]);
    s.appendChild(el("polygon",{class:"band",fill:bd.c,"fill-opacity":.85,
      points:curve.map((d,i)=>`${px(d.y)},${py(top[i])}`).join(" ")+" "+
             curve.map((d,i)=>`${px(d.y)},${py(base[i])}`).reverse().join(" ")}));
    const n=curve.length-1;
    if(top[n]-base[n]>0) s.appendChild(el("text",{x:W-m.r+5,y:py((base[n]+top[n])/2),
      class:"dlabel",fill:bd.c})).textContent=`${bd.label} ${top[n]-base[n]}`;
    base=top});
  const cross=el("line",{y1:m.t,y2:H-m.b,class:"cross",opacity:0}); s.appendChild(cross);
  const hit=el("rect",{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:"transparent"});
  s.appendChild(hit);
  const box=$("cv"), tip=$("cv-tip"); box.insertBefore(s,tip);
  hit.addEventListener("mousemove",ev=>{
    const r=box.getBoundingClientRect(), sc=W/(r.width-22);
    const i=Math.max(0,Math.min(curve.length-1,
      Math.round(((ev.clientX-r.left-11)*sc-m.l)/((W-m.l-m.r)/(curve.length-1)))));
    const d=curve[i];
    cross.setAttribute("x1",px(d.y));cross.setAttribute("x2",px(d.y));cross.setAttribute("opacity",1);
    tip.innerHTML=`<h4>${d.y}</h4>`+BANDS.map(b=>
      `<div class="r" style="--c:${b.c}"><i></i><span>${b.label}</span><b>${d[b.k]}</b></div>`).join("");
    tip.classList.add("on");
    tip.style.left=Math.min(Math.max(px(d.y)/sc-64,2),Math.max(r.width-142,2))+"px";tip.style.top="2px"});
  hit.addEventListener("mouseleave",()=>{tip.classList.remove("on");cross.setAttribute("opacity",0)});
})();
const c5=curve.find(d=>d.y===YEAR+5)||curve[curve.length-1];
$("cv-sub").textContent=`NOW ${curve[0].rdy} · ${YEAR+5} ${c5.rdy}`;
$("cv-legend").innerHTML=BANDS.map(b=>`<span style="--c:${b.c}"><i></i>${b.label}</span>`).join("");

/* ── mix / facets (클릭 = 필터) ───────── */
const lo=Math.min(...B.map(b=>b.drink_from)), hi=Math.max(...B.map(b=>b.drink_to));
const pct=y=>(y-lo)/(hi-lo)*100;
function renderFacet(){
  const host=$("mix");
  if(facetAxis==="vintage"){
    // 1981 한 병 때문에 앞쪽 14년이 비어 정작 중요한 1995~2024 구간이 눌린다.
    // 축은 1995부터 그리고, 그보다 오래된 병은 캡션으로 뺀다.
    const vs=B.filter(b=>b.vintage), V0=1995, V1=2024;
    const older=vs.filter(b=>b.vintage<V0);
    const cnt={}; vs.filter(b=>b.vintage>=V0).forEach(b=>cnt[b.vintage]=(cnt[b.vintage]||0)+qty(b));
    const n=V1-V0+1, W=380,H=112,m={t:8,r:6,b:16,l:16}, slot=(W-m.l-m.r)/n;
    const mx=Math.max(...Object.values(cnt));
    const s=svg(W,H);
    s.setAttribute("aria-label","빈티지별 보유 병 수. 막대가 없는 해가 공백이다.");
    [0,mx].forEach(v=>{
      const y=m.t+(1-v/mx)*(H-m.t-m.b);
      s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:y,y2:y,class:"gridline"}));
      s.appendChild(el("text",{x:m.l-3,y:y+3,"text-anchor":"end",class:"axis"})).textContent=v});
    for(let y=Math.ceil(V0/10)*10;y<=V1;y+=10)
      s.appendChild(el("text",{x:m.l+(y-V0+.5)*slot,y:H-m.b+11,"text-anchor":"middle",class:"axis"}))
        .textContent="'"+String(y).slice(2);
    for(let y=V0;y<=V1;y++){
      const v=cnt[y]||0, x=m.l+(y-V0)*slot;
      const g=el("g",{class:"vbar","data-vint":y});
      const bh=v?(1-(1-v/mx))*(H-m.t-m.b):0;
      g.appendChild(el("rect",{x:x+slot*.12,y:H-m.b-bh,width:Math.max(slot*.76,1.6),height:bh,
        fill:F.facet&&F.facet.type==="vintage"&&F.facet.value===y?"var(--cmd)":"var(--c-ready)",
        "fill-opacity":v?.9:0}));
      g.appendChild(el("rect",{x,y:m.t,width:slot,height:H-m.t-m.b,fill:"transparent"}));
      g.appendChild(el("title")).textContent=`${y} · ${v}병`;
      if(v) g.addEventListener("click",()=>{
        F.facet=(F.facet&&F.facet.type==="vintage"&&F.facet.value===y)?null:{type:"vintage",value:y};
        render()});
      s.appendChild(g)}
    host.innerHTML=""; host.className="pad"; host.appendChild(s);
    const gapY=[]; for(let y=1996;y<=2022;y++) if(!cnt[y])gapY.push(y);
    const p=document.createElement("div");
    p.style.cssText="font-family:var(--mono);font-size:9.8px;color:var(--ink-3);margin-top:4px";
    p.textContent=(older.length?older.map(b=>`${b.vintage} ${short0(b)}`).join(" · ")+"  ·  ":"")
      +"공백 "+gapY.join(" · ");
    host.appendChild(p);
    return;
  }
  const agg={};
  B.forEach(b=>{const k=facetAxis==="category"?b.category:grape(b);
    const a=agg[k]||(agg[k]=[0,0]); a[0]+=qty(b); a[1]+=value(b)});
  const mm=Math.max(...Object.values(agg).map(v=>v[1]));
  host.className="pad mix";
  host.innerHTML=Object.entries(agg).sort((a,b)=>b[1][1]-a[1][1]).map(([c,[n,v]])=>{
    const on=F.facet&&F.facet.type===facetAxis&&F.facet.value===c;
    return `<div data-facet="${esc(c)}" class="${on?"on":""}"><span>${esc(c)}</span>
      <em>${n}</em><b>${usd(v)}</b>
      <span class="t2"><i style="width:${v/mm*100}%"></i></span></div>`}).join("");
}
$("facet").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  facetAxis=b.dataset.f;
  [...e.currentTarget.children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===facetAxis));
  if(F.facet)F.facet=null;
  save(); render()});
$("mix").addEventListener("click",e=>{
  const d=e.target.closest("[data-facet]"); if(!d)return;
  const v=d.dataset.facet;
  F.facet=(F.facet&&F.facet.type===facetAxis&&F.facet.value===v)?null:{type:facetAxis,value:v};
  render()});

/* ── inventory ────────────────────────── */
$("presets").innerHTML=PRESETS.map(p=>
  `<button data-p="${p.k}" aria-pressed="${p.k===F.preset}">${p.label}</button>`).join("");
$("chips").innerHTML=ORDER.map(k=>{
  const n=B.filter(b=>b.status===k).reduce((s,b)=>s+qty(b),0);
  return `<button data-k="${k}" aria-pressed="${F.status.has(k)}" style="--c:var(${S[k].v})"
    title="${S[k].label}"><i class="d2"></i>${n}</button>`}).join("");
$("sort").value=sortKey;
[...$("view").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===view));
[...$("facet").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===facetAxis));

const SORTS={close:(a,b)=>a.drink_to-b.drink_to||a.id-b.id,
  price:(a,b)=>b.price.avg_usd-a.price.avg_usd,
  vintage:(a,b)=>(a.vintage||9999)-(b.vintage||9999),
  name:(a,b)=>a.display.localeCompare(b.display)};

function passes(b){
  if(!PRESETS.find(p=>p.k===F.preset).fn(b))return false;
  if(F.status.size&&!F.status.has(b.status))return false;
  if(F.quad&&!QUAD[F.quad].fn(b.price.avg_usd,left(b)))return false;
  if(F.facet){
    if(F.facet.type==="category"&&b.category!==F.facet.value)return false;
    if(F.facet.type==="grape"&&grape(b)!==F.facet.value)return false;
    if(F.facet.type==="vintage"&&b.vintage!==F.facet.value)return false;
  }
  if(F.sig!==null&&!DATA.insights[F.sig].ids.includes(b.id))return false;
  const t=F.q.trim().toLowerCase();
  if(t&&![b.display,b.producer,b.region,b.category,vint(b),code(b),...(b.grapes||[])]
    .join(" ").toLowerCase().includes(t))return false;
  return true;
}
function rows(list){
  const t=$("rows");
  if(!list.length){t.innerHTML=`<p class="empty">NO MATCH</p>`;return}
  t.innerHTML=list.map(b=>`<button class="item${b.id===selId?" sel":""}" data-id="${b.id}">
    <span class="id">${code(b)}</span>
    <span class="nm">${qty(b)>1?`<b>×${qty(b)}</b>`:""}<span>${esc(b.display)}</span></span>
    <span class="vt">${vint(b)}</span><span class="rg">${esc(b.region)}</span>
    <span class="st" style="--c:${cvar(b)}">${S[b.status].label}</span>
    <span class="win">${b.drink_from}–${b.drink_to}</span>
    <span class="left">${left(b)}y</span>
    <span class="pr">${usd(b.price.avg_usd)}</span></button>`).join("");
}
function timeline(list){
  const ticks=[]; for(let y=Math.ceil(lo/10)*10;y<=hi;y+=10)ticks.push(y);
  $("tl").innerHTML=
    `<div class="tl-axis">${ticks.map(y=>`<span style="left:${pct(y)}%">${y}</span>`).join("")}</div>
     <div class="tl-body"><div class="tl-grid">${ticks.map(y=>`<i style="left:${pct(y)}%"></i>`).join("")}
       <div class="tl-now" style="left:${pct(YEAR)}%"></div></div>
       ${list.map(b=>`<div class="row">
         <div class="rname" title="${esc(b.display)}">${esc(b.display)} <em>${vint(b)}</em></div>
         <div class="track"><a class="bar2${b.id===selId?" sel":""}" href="#" data-id="${b.id}"
           style="--c:${cvar(b)};left:${pct(b.drink_from)}%;
           width:${Math.max(pct(b.drink_to)-pct(b.drink_from),1.2)}%"
           title="${esc(b.display)} ${b.drink_from}–${b.drink_to}"></a></div></div>`).join("")}</div>`;
}
function fbar(){
  const chips=[];
  if(F.preset!=="all")chips.push(["preset",PRESETS.find(p=>p.k===F.preset).label]);
  F.status.forEach(k=>chips.push(["status:"+k,S[k].label]));
  if(F.quad)chips.push(["quad",QUAD[F.quad].label+" 구역"]);
  if(F.facet)chips.push(["facet",F.facet.value]);
  if(F.sig!==null)chips.push(["sig",DATA.insights[F.sig].tag+" "+DATA.insights[F.sig].head]);
  if(F.q)chips.push(["q",'"'+F.q+'"']);
  const bar=$("fbar");
  bar.hidden=!chips.length;
  if(!chips.length)return;
  bar.innerHTML=`<span class="lbl">FILTER</span>`+
    chips.map(([k,l])=>`<button class="fchip" data-clear="${k}"><b>${esc(l)}</b>✕</button>`).join("")+
    `<button class="fclear" data-clear="all">CLEAR ALL</button>`;
}
function render(){
  curList=B.filter(passes).sort(SORTS[sortKey]);
  if(selId&&!curList.some(b=>b.id===selId))selId=null;
  rows(curList); timeline([...curList].sort(SORTS.close)); fbar(); renderFacet();
  const ids=new Set(curList.map(b=>b.id));
  B.forEach(b=>{const d=dotById[b.id]; if(!d)return;
    d.classList.toggle("off",!ids.has(b.id)); d.classList.toggle("sel",b.id===selId)});
  document.querySelectorAll(".quadhit").forEach(r=>
    r.classList.toggle("on",r.dataset.quad===F.quad));
  document.querySelectorAll("#alerts .al").forEach(a=>
    a.classList.toggle("on",+a.dataset.sig===F.sig));
  [...$("presets").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.p===F.preset));
  [...$("chips").children].forEach(c=>c.setAttribute("aria-pressed",F.status.has(c.dataset.k)));
  $("count").textContent=
    `${curList.reduce((s,b)=>s+qty(b),0)} BTL · ${usd(curList.reduce((s,b)=>s+value(b),0))}`;
  save();
}
$("fbar").addEventListener("click",e=>{
  const b=e.target.closest("[data-clear]"); if(!b)return;
  const k=b.dataset.clear;
  if(k==="all"){F.preset="all";F.status.clear();F.quad=null;F.facet=null;F.sig=null;
    F.q="";$("q").value=""}
  else if(k==="preset")F.preset="all";
  else if(k.startsWith("status:"))F.status.delete(k.slice(7));
  else if(k==="quad")F.quad=null; else if(k==="facet")F.facet=null;
  else if(k==="sig")F.sig=null; else if(k==="q"){F.q="";$("q").value=""}
  render()});
$("presets").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; F.preset=b.dataset.p; render()});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; const k=b.dataset.k;
  F.status.has(k)?F.status.delete(k):F.status.add(k); render()});
$("view").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; setView(b.dataset.v)});
function setView(v){view=v;
  [...$("view").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===view));
  $("table-view").hidden=view!=="table"; $("time-view").hidden=view!=="time"; save()}
$("q").addEventListener("input",e=>{F.q=e.target.value;render()});
$("sort").addEventListener("change",e=>{sortKey=e.target.value;render()});
$("copy").addEventListener("click",async()=>{
  const csv=["id,wine,vintage,region,status,from,to,qty,usd",
    ...curList.map(b=>[code(b),`"${b.display}"`,vint(b),`"${b.region}"`,S[b.status].label,
      b.drink_from,b.drink_to,qty(b),b.price.avg_usd].join(","))].join("\n");
  let ok=false;
  try{await navigator.clipboard.writeText(csv);ok=true}catch(e){
    try{const ta=document.createElement("textarea");ta.value=csv;ta.style.position="fixed";
      ta.style.opacity="0";document.body.appendChild(ta);ta.select();
      ok=document.execCommand("copy");ta.remove()}catch(e2){}}
  const btn=$("copy"); btn.textContent=ok?"COPIED":"복사 실패";
  setTimeout(()=>{btn.textContent="COPY"},1400)});

/* ── gaps · flags ─────────────────────── */
$("gaps").innerHTML=DATA.gaps.map(g=>`<div class="gap-i">
  <h3>${esc(g.title)}<span class="tag" style="--c:var(${g.severity==="high"?"--s-urgent":"--s-now"})">${g.severity==="high"?"PRI":"SEC"}</span></h3>
  <p>${esc(g.why.split(".")[0])}.</p>
  <div class="picks">${g.picks.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`).join("");
$("flags").innerHTML=(DATA.flags||[]).map(f=>`<div class="flag">
  <h3><em>${code(byId[f.id])}</em>${esc(f.title)}</h3><p>${esc(f.text)}</p></div>`).join("")
  ||`<p class="empty">NONE</p>`;
$("foot").textContent=DATA.price_note+" "+DATA.storage.note;

/* ── drawer ───────────────────────────── */
const drawer=$("drawer"), scrim=$("scrim");
let lastFocus=null;
function peers(b){
  const same=k=>B.filter(x=>x.id!==b.id&&k(x));
  const reg=same(x=>x.region===b.region), gr=same(x=>grape(x)===grape(b)&&grape(b)!=="—");
  const btn=x=>`<button data-id="${x.id}">${code(x)} ${esc(x.display.slice(0,18))}</button>`;
  let out="";
  if(reg.length)out+=`<div class="blk"><h3>Same region</h3><div class="peers">${reg.map(btn).join("")}</div></div>`;
  if(gr.length)out+=`<div class="blk"><h3>Same grape · ${esc(grape(b))}</h3><div class="peers">${gr.slice(0,8).map(btn).join("")}</div></div>`;
  return out;
}
function openDrawer(id){
  const b=byId[id]; if(!b)return; const p=b.profile, pr=b.price;
  const rank=[...B].sort((x,y)=>y.price.avg_usd-x.price.avg_usd).findIndex(x=>x.id===id)+1;
  $("drawer-inner").innerHTML=`
    <div class="d-head"><div class="code">${code(b)} · VALUE RANK ${rank}/${B.length}</div>
      <h2 id="d-title">${esc(b.display)}</h2>
      <div class="d-sub"><span>${vint(b)}</span><span>${esc(b.region)}</span>
        <span style="color:${cvar(b)}">${S[b.status].label}</span>
        <span>${b.drink_from}–${b.drink_to} · ${left(b)}y</span></div></div>
    <div class="d-body">
      <div class="d-price">
        <div class="cf">${pr.confidence==="none"?"참고 추정가 · WS 미등재":"WINE-SEARCHER 전세계 평균"}</div>
        <div class="amt"><b>${usd(pr.avg_usd)}</b><span>${esc(pr.basis||"750ml ex-tax")}${qty(b)>1?` · ${qty(b)}병`:""}</span></div>
        <div class="krw">≈ ₩${won(pr.avg_usd).toLocaleString()}</div>
        <div class="cf">신뢰도 <b>${CONF[pr.confidence]}</b>${pr.note?` — ${esc(pr.note)}`:""}</div>
        ${pr.verified?`<div class="cf" style="color:var(--s-peak)">✓ ${esc(pr.verified)}</div>`:""}
        <a class="ws" href="${b.ws_url}" target="_blank" rel="noopener noreferrer">WINE-SEARCHER ↗</a></div>
      <div class="d-win"><div class="ba">
        <div class="fill" style="--c:${cvar(b)};left:${pct(b.drink_from)}%;
             width:${Math.max(pct(b.drink_to)-pct(b.drink_from),1.5)}%"></div>
        <div class="mark" style="left:${pct(YEAR)}%"></div></div>
        <div class="ends"><span>${lo}</span><span>${hi}</span></div></div>
      <div class="blk"><h3>Style</h3><p class="lead">${esc(p.style)}</p></div>
      <div class="blk"><h3>Tasting</h3><p>${esc(p.tasting)}</p></div>
      <div class="blk"><h3>Background</h3><p>${esc(p.story)}</p></div>
      <div class="blk"><h3>Service</h3><dl class="serve">
        <div><dt>TEMP</dt><dd>${esc(p.serve.temp)}</dd></div>
        <div><dt>DECANT</dt><dd>${esc(p.serve.decant)}</dd></div>
        <div><dt>GLASS</dt><dd>${esc(p.serve.glass)}</dd></div></dl></div>
      <div class="blk"><h3>Pairing</h3><div class="tags">${p.pair.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
      <div class="blk"><h3>Note</h3><p>${esc(b.notes)}</p></div>
      ${peers(b)}
      <div class="d-meta">
        <div><b>PRODUCER</b><span>${esc(b.producer)}</span></div>
        ${b.classification?`<div><b>CLASS</b><span>${esc(b.classification)}</span></div>`:""}
        ${b.grapes?.length?`<div><b>GRAPES</b><span>${b.grapes.map(esc).join(" · ")}</span></div>`:""}
        ${b.abv?`<div><b>ABV</b><span>${b.abv}%</span></div>`:""}
        <div><b>FORMAT</b><span>${b.format_ml??750}ml</span></div>
        <div><b>QTY</b><span>${qty(b)}</span></div></div></div>`;
  selId=id; render();
  lastFocus=document.activeElement; drawer.hidden=false;
  requestAnimationFrame(()=>{drawer.classList.add("on");scrim.classList.add("on")});
  drawer.scrollTop=0; $("close").focus();
}
function closeDrawer(){drawer.classList.remove("on");scrim.classList.remove("on");
  setTimeout(()=>{drawer.hidden=true},200); lastFocus?.focus()}
scrim.addEventListener("click",closeDrawer);
$("close").addEventListener("click",closeDrawer);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-id]"); if(!t)return; e.preventDefault(); openDrawer(+t.dataset.id)});

/* ── keyboard ─────────────────────────── */
function moveSel(step){
  if(!curList.length)return;
  const i=curList.findIndex(b=>b.id===selId);
  const n=i<0?(step>0?0:curList.length-1):Math.min(Math.max(i+step,0),curList.length-1);
  selId=curList[n].id; render();
  const row=document.querySelector(`.item[data-id="${selId}"]`);
  row?.scrollIntoView({block:"nearest"});
}
document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==="Escape"){ if(!drawer.hidden)closeDrawer(); else if(typing)document.activeElement.blur(); return }
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();$("q").focus();return}
  if(e.key==="j"||e.key==="ArrowDown"){e.preventDefault();moveSel(1);return}
  if(e.key==="k"||e.key==="ArrowUp"){e.preventDefault();moveSel(-1);return}
  if(e.key==="Enter"&&selId){e.preventDefault();openDrawer(selId);return}
  if(e.key==="c"){F.preset="all";F.status.clear();F.quad=null;F.facet=null;F.sig=null;
    F.q="";$("q").value="";render();return}
  if(e.key==="t"){setView(view==="table"?"time":"table");return}
  const n=+e.key;
  if(n>=1&&n<=5){const k=ORDER[n-1];F.status.has(k)?F.status.delete(k):F.status.add(k);render()}
});

setView(view);
render();
</script>
