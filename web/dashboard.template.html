<title>셀러 인텔리전스</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F0F2; --panel:#FBFAFB; --sunken:#E9E5E9; --line:#D8D2D8; --grid:#E6E1E6;
  --ink:#141017; --ink-2:#5B5261; --ink-3:#8A8190;
  --accent:#96223F; --accent-soft:rgba(150,34,63,.07);
  --s-urgent:#A93226; --s-now:#A9701F; --s-peak:#3F6B46; --s-dh:#2F6A78; --s-hold:#46578A;
  --c-past:#B85708; --c-ready:#00897B; --c-hold:#5344E0;
  --band:.20; --shadow:0 18px 50px rgba(20,16,23,.2);
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0C12; --panel:#17131D; --sunken:#201A27; --line:#2C2533; --grid:#221C28;
  --ink:#EDE7EC; --ink-2:#9C909B; --ink-3:#6B6270;
  --accent:#E2657F; --accent-soft:rgba(226,101,127,.1);
  --s-urgent:#E0705F; --s-now:#D6A353; --s-peak:#7BAE80; --s-dh:#6CB0BE; --s-hold:#8A9BCB;
  --c-past:#D07C1E; --c-ready:#12A892; --c-hold:#8474EE;
  --band:.28; --shadow:0 18px 50px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0F0C12; --panel:#17131D; --sunken:#201A27; --line:#2C2533; --grid:#221C28;
  --ink:#EDE7EC; --ink-2:#9C909B; --ink-3:#6B6270;
  --accent:#E2657F; --accent-soft:rgba(226,101,127,.1);
  --s-urgent:#E0705F; --s-now:#D6A353; --s-peak:#7BAE80; --s-dh:#6CB0BE; --s-hold:#8A9BCB;
  --c-past:#D07C1E; --c-ready:#12A892; --c-hold:#8474EE;
  --band:.28; --shadow:0 18px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:22px 56px;
      display:grid;gap:20px}
h1,h2{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── header ───────────────────────────── */
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.13em;text-transform:uppercase}
.sys{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.kbd b{border:1px solid var(--line);border-radius:2px;padding:0 4px;font-weight:500;color:var(--ink-2)}

.readout{display:grid;grid-template-columns:repeat(3,1fr);
         border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
@media (min-width:820px){.readout{grid-template-columns:repeat(6,1fr)}}
.readout div{padding:9px 12px;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.readout div:nth-child(-n+3){border-top:0}
@media (min-width:820px){.readout div{border-top:0}}
.readout dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
            color:var(--ink-3);margin-bottom:2px}
.readout dd{margin:0;font-family:var(--mono);font-size:17px;font-weight:500;line-height:1.15;
            font-variant-numeric:tabular-nums}
.readout dd small{font-size:10px;font-weight:400;color:var(--ink-3);margin-left:2px}

/* ── block ────────────────────────────── */
.block{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.bh{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);
    background:var(--sunken)}
.bh h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;
       text-transform:uppercase;color:var(--ink-2)}
.bh .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}

/* ── signals ──────────────────────────── */
.sig{display:grid;grid-template-columns:52px minmax(120px,auto) minmax(110px,auto) 1fr;
     gap:0 14px;align-items:baseline;padding:8px 12px;border-top:1px solid var(--line)}
.sig:first-of-type{border-top:0}
.sig .t{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;
        color:var(--c);border:1px solid var(--c);border-radius:2px;padding:0 4px;
        justify-self:start;line-height:1.5}
.sig .h{font-weight:600;font-size:13.2px;white-space:nowrap}
.sig .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sig .d{font-size:12.2px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){
  .sig{grid-template-columns:52px 1fr auto;gap:2px 10px}
  .sig .d{grid-column:1/-1;white-space:normal}
}

/* ── charts ───────────────────────────── */
.duo{display:grid;gap:20px}
@media (min-width:900px){.duo{grid-template-columns:1fr 1fr}}
.plot{position:relative;padding:10px 12px 6px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--ink-3);font-family:var(--mono);font-size:9.5px}
.band{stroke:var(--panel);stroke-width:2;stroke-linejoin:round}
.dlabel{font-family:var(--mono);font-size:10px;font-weight:500;dominant-baseline:middle}
.qlabel{fill:var(--ink-3);font-family:var(--mono);font-size:9px;letter-spacing:.06em;
        paint-order:stroke fill;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.quadline{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 4;opacity:.45}
.cross{stroke:var(--ink-3);stroke-width:1;opacity:.5}
.dot{cursor:pointer;stroke:var(--panel);stroke-width:1.5}
.dot:hover{stroke:var(--ink)}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--bg);
     border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
     padding:7px 9px;font-size:11.5px;min-width:140px;z-index:5}
.tip.on{opacity:1}
.tip h4{margin:0 0 4px;font-family:var(--mono);font-size:11px;font-weight:600}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between;line-height:1.65}
.tip .r i{width:6px;height:6px;border-radius:1px;background:var(--c);flex:none}
.tip .r span{flex:1;color:var(--ink-2)}
.tip .r b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;padding:0 12px 10px;font-family:var(--mono);
        font-size:10px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:1px;vertical-align:middle;
          margin-right:5px;background:var(--c)}

/* ── toolbar ──────────────────────────── */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;
     border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{padding:4px 10px;border:0;border-right:1px solid var(--line);background:var(--panel);
  color:var(--ink-3);font-family:var(--mono);font-size:10.5px;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg.status button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);
  box-shadow:inset 0 -2px 0 var(--c)}
.seg .d2{display:inline-block;width:6px;height:6px;border-radius:1px;background:var(--c);
         margin-right:5px;vertical-align:middle}
#q,#sort{padding:4px 9px;border:1px solid var(--line);border-radius:var(--r);
   background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:10.5px}
#q{flex:1;min-width:140px}
.bar .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:auto}

/* ── table ────────────────────────────── */
.thead,.item{display:grid;
  grid-template-columns:38px minmax(160px,2.2fr) 44px minmax(90px,1fr) 62px 76px 40px 62px;
  gap:10px;align-items:center;padding:0 12px}
.thead{height:26px;border-bottom:1px solid var(--line);background:var(--sunken);
       font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
       color:var(--ink-3)}
.thead span:nth-child(n+7){text-align:right}
.item{height:30px;width:100%;border:0;border-top:1px solid var(--line);background:none;
      color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:first-of-type{border-top:0}
.item:hover{background:var(--accent-soft)}
.id{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.nm{display:flex;align-items:center;gap:6px;min-width:0;font-weight:500;font-size:12.8px}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{flex:none;font-family:var(--mono);font-size:9px;font-weight:500;color:var(--ink-3);
      border:1px solid var(--line);border-radius:2px;padding:0 3px}
.vt,.win,.left,.pr{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;
                   color:var(--ink-2)}
.left,.pr{text-align:right}
.pr{color:var(--ink)}
.rg{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-family:var(--mono);font-size:10px;color:var(--c);white-space:nowrap}
.empty{padding:22px 12px;color:var(--ink-3);font-size:12.5px}

/* ── timeline ─────────────────────────── */
.tl-scroll{overflow-x:auto;padding:10px 12px}
.tl{min-width:640px;--gutter:26px;--lane:180px}
.tl-axis{position:relative;height:14px;margin-left:var(--lane);margin-right:var(--gutter);
         font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-body{position:relative}
.tl-grid{position:absolute;inset:0 var(--gutter) 0 var(--lane);pointer-events:none}
.tl-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.tl-now{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.75}
.tl-now::after{content:"NOW";position:absolute;top:-14px;left:3px;font-family:var(--mono);
               font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.row{display:grid;grid-template-columns:var(--lane) 1fr;align-items:center;height:19px}
.rname{font-size:11.2px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis;padding-right:10px}
.rname em{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--ink-3)}
.track{position:relative;height:100%;margin-right:var(--gutter)}
.bar2{position:absolute;top:6px;height:8px;cursor:pointer;
     background:color-mix(in srgb,var(--c) calc(var(--band)*100%),transparent);
     border-left:2px solid var(--c)}
.bar2::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--c);opacity:.5}
.bar2:hover{background:color-mix(in srgb,var(--c) 45%,transparent)}

/* ── bottom ───────────────────────────── */
.trio{display:grid;gap:20px}
@media (min-width:900px){.trio{grid-template-columns:1fr 1fr 1fr}}
.pad{padding:10px 12px}
.mix div{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
         font-size:11.8px;margin-bottom:6px}
.mix em{font-family:var(--mono);font-style:normal;font-size:10.5px;color:var(--ink-3)}
.mix b{font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--ink-2);
       min-width:42px;text-align:right}
.mix .t2{grid-column:1/-1;height:3px;background:var(--sunken);overflow:hidden}
.mix .t2 i{display:block;height:100%;background:var(--accent);opacity:.7}
.gap-i{padding:8px 0;border-top:1px solid var(--line)}
.gap-i:first-child{border-top:0;padding-top:0}
.gap-i h3{margin:0;font-size:12.6px;font-weight:600;display:flex;align-items:baseline;gap:7px}
.gap-i .tag{font-family:var(--mono);font-size:9.5px;padding:0 5px;border-radius:2px;
            color:var(--c);border:1px solid var(--c)}
.gap-i p{margin:3px 0 5px;font-size:11.8px;color:var(--ink-3)}
.picks{display:flex;flex-wrap:wrap;gap:4px}
.picks span{font-family:var(--mono);font-size:10.3px;padding:1px 6px;border-radius:2px;
            background:var(--sunken);color:var(--ink-2)}
.flag{padding:8px 0;border-top:1px solid var(--line)}
.flag:first-child{border-top:0;padding-top:0}
.flag h3{margin:0;font-size:12.4px;font-weight:600}
.flag h3 em{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--accent);margin-right:6px}
.flag p{margin:3px 0 0;font-size:11.8px;color:var(--ink-3)}
footer{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.75;max-width:96ch}

/* ── panel ────────────────────────────── */
#scrim{position:fixed;inset:0;background:rgba(8,6,10,.55);opacity:0;pointer-events:none;
       transition:opacity .16s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);z-index:50;background:var(--bg);
       border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(101%);
       transition:transform .2s cubic-bezier(.4,0,.2,1);overflow-y:auto;overscroll-behavior:contain}
#panel.on{transform:none}
.p-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
        padding:16px 20px 12px;display:grid;gap:5px}
.p-head .code{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--accent)}
.p-head h2{font-size:18px;font-weight:600;line-height:1.25}
.p-sub{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
#close{position:absolute;top:13px;right:13px;width:24px;height:24px;border-radius:2px;
       border:1px solid var(--line);background:var(--bg);color:var(--ink-3);font-size:12px;cursor:pointer}
#close:hover{border-color:var(--accent);color:var(--ink)}
.p-body{padding:16px 20px 36px;display:grid;gap:17px}
.p-price{display:grid;gap:5px;padding:11px 12px;background:var(--panel);
         border:1px solid var(--line);border-radius:var(--r)}
.p-price .amt{display:flex;align-items:baseline;gap:7px}
.p-price .amt b{font-family:var(--mono);font-weight:600;font-size:23px;line-height:1;
                font-variant-numeric:tabular-nums}
.p-price .amt span,.p-price .cf,.p-price .krw{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.p-price .krw{color:var(--ink-2)}
.p-price .cf b{font-weight:600;color:var(--ink-2)}
.ws{display:inline-flex;justify-self:start;font-family:var(--mono);font-size:10.5px;
    text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:2px;
    padding:3px 9px;margin-top:2px}
.ws:hover{border-color:var(--accent)}
.blk h3{margin:0 0 4px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;
        text-transform:uppercase;color:var(--ink-3)}
.blk p{margin:0;font-size:12.6px;color:var(--ink-2)}
.blk p.lead{color:var(--ink)}
.serve{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.serve div{padding:8px 9px;background:var(--panel)}
.serve dt{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-bottom:2px}
.serve dd{margin:0;font-size:11.8px;font-weight:500;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11.3px;padding:1px 8px;border-radius:2px;border:1px solid var(--line);color:var(--ink-2)}
.p-win{display:grid;gap:4px}
.p-win .ba{position:relative;height:7px;background:var(--sunken)}
.p-win .fill{position:absolute;top:0;bottom:0;background:var(--c);opacity:.6}
.p-win .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.p-win .ends{display:flex;justify-content:space-between;font-family:var(--mono);
             font-size:10px;color:var(--ink-3)}
.p-meta{display:grid;gap:3px;font-size:11.5px;color:var(--ink-3)}
.p-meta div{display:grid;grid-template-columns:64px 1fr;gap:8px}
.p-meta b{font-family:var(--mono);font-weight:400;font-size:10px}

@media (max-width:760px){
  .thead{display:none}
  .item{grid-template-columns:34px 1fr 60px;height:auto;padding-block:7px;row-gap:2px}
  .rg,.vt,.win{display:none} .st{grid-column:2} .left{display:none}
  .pr{grid-column:3;justify-self:end}
  .serve{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <h1>Cellar</h1>
    <span class="sys" id="sys"></span>
    <span class="kbd"><b>/</b> 검색 <b>esc</b> 닫기</span>
  </div>

  <dl class="readout" id="readout"></dl>

  <div class="block">
    <div class="bh"><h2>Signals</h2><span class="sub" id="sig-n"></span></div>
    <div id="sig-list"></div>
  </div>

  <div class="duo">
    <div class="block">
      <div class="bh"><h2>Value × Time</h2><span class="sub" id="mx-sub"></span></div>
      <div class="plot" id="mx"><div class="tip" id="mx-tip"></div></div>
      <div class="legend" id="mx-legend"></div>
    </div>
    <div class="block">
      <div class="bh"><h2>Maturity</h2><span class="sub" id="cv-sub"></span></div>
      <div class="plot" id="cv"><div class="tip" id="cv-tip"></div></div>
      <div class="legend" id="cv-legend"></div>
    </div>
  </div>

  <div class="block">
    <div class="bh"><h2>Inventory</h2><span class="sub" id="count"></span></div>
    <div class="bar">
      <div class="seg" id="view">
        <button data-v="table" aria-pressed="true">표</button>
        <button data-v="time" aria-pressed="false">타임라인</button>
      </div>
      <div class="seg" id="presets"></div>
      <div class="seg status" id="chips"></div>
      <input id="q" type="search" placeholder="검색" autocomplete="off">
      <select id="sort" aria-label="정렬">
        <option value="close">마감순</option>
        <option value="price">가격순</option>
        <option value="vintage">빈티지순</option>
        <option value="name">이름순</option>
      </select>
    </div>
    <div id="table-view">
      <div class="thead">
        <span>ID</span><span>Wine</span><span>Vint</span><span>Region</span>
        <span>Status</span><span>Window</span><span>Left</span><span>Value</span>
      </div>
      <div id="rows"></div>
    </div>
    <div id="time-view" hidden><div class="tl-scroll"><div class="tl" id="tl"></div></div></div>
  </div>

  <div class="trio">
    <div class="block">
      <div class="bh"><h2>Mix</h2><span class="sub">가치 기준</span></div>
      <div class="pad mix" id="mix"></div>
    </div>
    <div class="block">
      <div class="bh"><h2>Gaps</h2></div>
      <div class="pad" id="gaps"></div>
    </div>
    <div class="block">
      <div class="bh"><h2>Flags</h2></div>
      <div class="pad" id="flags"></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<div id="scrim"></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden>
  <button id="close" aria-label="닫기">✕</button>
  <div id="panel-inner"></div>
</aside>

<script>
const DATA=/*__DATA__*/, YEAR=+DATA.updated.slice(0,4), ST=DATA.stats;
const KRW=1380, KR_MULT=1.7;
const S={urgent:{label:"긴급",v:"--s-urgent"},drink_now:{label:"지금",v:"--s-now"},
  peak:{label:"피크",v:"--s-peak"},drink_or_hold:{label:"음용/홀드",v:"--s-dh"},
  hold:{label:"홀드",v:"--s-hold"}};
const ORDER=["urgent","drink_now","peak","drink_or_hold","hold"];
const CONF={high:"높음",medium:"보통",low:"낮음",none:"없음"};
const SEV={high:"--s-urgent",med:"--s-now",low:"--s-dh"};
const B=[...DATA.bottles], byId=Object.fromEntries(B.map(b=>[b.id,b]));
const qty=b=>b.qty??1, vint=b=>b.vintage?String(b.vintage):(b.vintage_label||"NV");
const cvar=b=>`var(${S[b.status].v})`;
const value=b=>b.price.avg_usd*(b.format_ml===375?.5:1)*qty(b);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=n=>"$"+Math.round(n).toLocaleString();
const won=u=>Math.round(u*KRW*KR_MULT/1000)*1000;
const code=b=>"B"+String(b.id).padStart(2,"0");
const ready=b=>b.drink_from<=YEAR&&b.drink_to>=YEAR&&b.status!=="hold";
const NS="http://www.w3.org/2000/svg";
const svg=(w,h)=>{const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("role","img");return s};
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};

/* header */
const yrs=B.filter(b=>b.vintage).map(b=>b.vintage);
document.getElementById("sys").textContent=
  `${DATA.updated} · ${ST.kinds} SKU · ${Math.min(...yrs)}–${Math.max(...yrs)} · ${DATA.storage.temp_c}°C`;
const held=B.filter(b=>b.status==="hold").reduce((s,b)=>s+qty(b),0);
const soon=B.filter(b=>b.drink_to-YEAR<=3).reduce((s,b)=>s+qty(b),0);
const rdyN=B.filter(ready).reduce((s,b)=>s+qty(b),0);
document.getElementById("readout").innerHTML=[
  ["보유",`${ST.total}<small>병</small>`],["가치",usd(ST.worth)],
  ["병당",`${usd(ST.avg)}<small>/중앙 ${usd(ST.median_value)}</small>`],
  ["지금 가능",`${rdyN}<small>병</small>`],["3년 내 마감",`${soon}<small>병</small>`],
  ["홀드",`${held}<small>병</small>`],
].map(([t,v])=>`<div><dt>${t}</dt><dd>${v}</dd></div>`).join("");

/* signals */
document.getElementById("sig-n").textContent=DATA.insights.length;
document.getElementById("sig-list").innerHTML=DATA.insights.map(i=>`
  <div class="sig" style="--c:var(${SEV[i.sev]})">
    <span class="t">${esc(i.tag)}</span><span class="h">${esc(i.head)}</span>
    <span class="v">${esc(i.metric)}</span><span class="d" title="${esc(i.detail)}">${esc(i.detail)}</span>
  </div>`).join("");

/* value × time */
(function(){
  const W=560,H=300,m={t:16,r:14,b:28,l:42};
  const XM=Math.max(...B.map(b=>b.drink_to-YEAR)), YM=Math.max(...B.map(b=>b.price.avg_usd));
  const px=v=>m.l+v/XM*(W-m.l-m.r), py=v=>H-m.b-v/YM*(H-m.t-m.b);
  const s=svg(W,H);
  s.setAttribute("aria-label","가로 남은 음용 연수, 세로 병당 가치. 중앙값으로 네 구역을 나눈다.");
  [0,200,400,600].forEach(v=>{
    s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:py(v),y2:py(v),class:"gridline"}));
    s.appendChild(el("text",{x:m.l-7,y:py(v)+3,"text-anchor":"end",class:"axis"})).textContent="$"+v});
  [0,5,10,15,20,25].filter(v=>v<=XM).forEach(v=>
    s.appendChild(el("text",{x:px(v),y:H-m.b+13,"text-anchor":"middle",class:"axis"})).textContent=v+"y");
  s.appendChild(el("line",{x1:px(ST.median_years),x2:px(ST.median_years),y1:m.t,y2:H-m.b,class:"quadline"}));
  s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:py(ST.median_value),y2:py(ST.median_value),class:"quadline"}));
  [["위험",m.l+6,m.t+9,"start"],["자산",W-m.r-6,m.t+9,"end"],
   ["소비",m.l+8,H-m.b-14,"start"],["대기",W-m.r-6,H-m.b-14,"end"]].forEach(([t,x,y,a])=>
    s.appendChild(el("text",{x,y,"text-anchor":a,class:"qlabel"})).textContent=t);
  const box=document.getElementById("mx"), tip=document.getElementById("mx-tip");
  [...B].sort((a,b)=>b.price.avg_usd-a.price.avg_usd).forEach(b=>{
    const c=el("circle",{cx:px(b.drink_to-YEAR),cy:py(b.price.avg_usd),r:qty(b)>1?6:4.5,
      fill:cvar(b),"fill-opacity":.85,class:"dot","data-id":b.id});
    c.addEventListener("mouseenter",()=>{
      tip.innerHTML=`<h4>${esc(b.display)} ${vint(b)}</h4>
        <div class="r"><span>가치</span><b>${usd(b.price.avg_usd)}</b></div>
        <div class="r"><span>잔여</span><b>${b.drink_to-YEAR}년</b></div>
        <div class="r" style="--c:${cvar(b)}"><i></i><span>상태</span><b>${S[b.status].label}</b></div>`;
      tip.classList.add("on");
      const r=box.getBoundingClientRect(), sc=W/(r.width-24);
      tip.style.left=Math.min(Math.max(px(b.drink_to-YEAR)/sc-70,2),r.width-170)+"px";
      tip.style.top=Math.max(py(b.price.avg_usd)/sc-64,2)+"px"});
    c.addEventListener("mouseleave",()=>tip.classList.remove("on"));
    s.appendChild(c)});
  box.insertBefore(s,tip);
})();
const risk=B.filter(b=>b.price.avg_usd>=ST.median_value&&b.drink_to-YEAR<ST.median_years);
document.getElementById("mx-sub").textContent=
  `중앙값 ${usd(ST.median_value)} · ${ST.median_years}년 · 위험 ${risk.length}종`;
document.getElementById("mx-legend").innerHTML=ORDER.map(k=>
  `<span style="--c:var(${S[k].v})"><i></i>${S[k].label}</span>`).join("");

/* maturity */
const LAST=Math.max(...B.map(b=>b.drink_to)), TOT=ST.total, curve=[];
for(let y=YEAR;y<=LAST;y++){let p=0,r=0,h=0;
  B.forEach(b=>{const n=qty(b); if(b.drink_to<y)p+=n; else if(b.drink_from<=y)r+=n; else h+=n});
  curve.push({y,past:p,rdy:r,hold:h})}
const BANDS=[{k:"past",label:"마감",c:"var(--c-past)"},{k:"rdy",label:"가능",c:"var(--c-ready)"},
  {k:"hold",label:"잠김",c:"var(--c-hold)"}];
(function(){
  const W=560,H=300,m={t:16,r:58,b:28,l:30};
  const px=y=>m.l+(y-YEAR)/(LAST-YEAR)*(W-m.l-m.r), py=v=>m.t+(1-v/TOT)*(H-m.t-m.b);
  const s=svg(W,H);
  s.setAttribute("aria-label",`${YEAR}년부터 ${LAST}년까지 ${TOT}병의 잠김·가능·마감 추이`);
  [0,Math.round(TOT/2),TOT].forEach(v=>{
    s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:py(v),y2:py(v),class:"gridline"}));
    s.appendChild(el("text",{x:m.l-7,y:py(v)+3,"text-anchor":"end",class:"axis"})).textContent=v});
  for(let y=Math.ceil(YEAR/10)*10;y<=LAST;y+=10)
    s.appendChild(el("text",{x:px(y),y:H-m.b+13,"text-anchor":"middle",class:"axis"})).textContent=y;
  let base=curve.map(()=>0);
  BANDS.forEach(bd=>{
    const top=curve.map((d,i)=>base[i]+d[bd.k]);
    s.appendChild(el("polygon",{class:"band",fill:bd.c,"fill-opacity":.85,
      points:curve.map((d,i)=>`${px(d.y)},${py(top[i])}`).join(" ")+" "+
             curve.map((d,i)=>`${px(d.y)},${py(base[i])}`).reverse().join(" ")}));
    const n=curve.length-1;
    if(top[n]-base[n]>0) s.appendChild(el("text",{x:W-m.r+6,y:py((base[n]+top[n])/2),
      class:"dlabel",fill:bd.c})).textContent=`${bd.label} ${top[n]-base[n]}`;
    base=top});
  const cross=el("line",{y1:m.t,y2:H-m.b,class:"cross",opacity:0}); s.appendChild(cross);
  const hit=el("rect",{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:"transparent"});
  s.appendChild(hit);
  const box=document.getElementById("cv"), tip=document.getElementById("cv-tip");
  box.insertBefore(s,tip);
  hit.addEventListener("mousemove",ev=>{
    const r=box.getBoundingClientRect(), sc=W/(r.width-24);
    const i=Math.max(0,Math.min(curve.length-1,
      Math.round(((ev.clientX-r.left-12)*sc-m.l)/((W-m.l-m.r)/(curve.length-1)))));
    const d=curve[i];
    cross.setAttribute("x1",px(d.y));cross.setAttribute("x2",px(d.y));cross.setAttribute("opacity",1);
    tip.innerHTML=`<h4>${d.y}</h4>`+BANDS.map(b=>
      `<div class="r" style="--c:${b.c}"><i></i><span>${b.label}</span><b>${d[b.k]}</b></div>`).join("");
    tip.classList.add("on");
    tip.style.left=Math.min(Math.max(px(d.y)/sc-70,2),r.width-160)+"px"; tip.style.top="2px"});
  hit.addEventListener("mouseleave",()=>{tip.classList.remove("on");cross.setAttribute("opacity",0)});
})();
const c5=curve.find(d=>d.y===YEAR+5)||curve[curve.length-1];
document.getElementById("cv-sub").textContent=`지금 ${curve[0].rdy} 가능 · ${YEAR+5}년 ${c5.rdy} 가능`;
document.getElementById("cv-legend").innerHTML=BANDS.map(b=>
  `<span style="--c:${b.c}"><i></i>${b.label}</span>`).join("");

/* inventory */
const lo=Math.min(...B.map(b=>b.drink_from)), hi=Math.max(...B.map(b=>b.drink_to));
const pct=y=>(y-lo)/(hi-lo)*100;
const PRESETS=[{k:"all",label:"전체",fn:()=>true},
  {k:"now",label:"지금",fn:ready},
  {k:"soon",label:"3년",fn:b=>b.drink_to-YEAR<=3},
  {k:"top",label:"$300+",fn:b=>b.price.avg_usd>=300},
  {k:"white",label:"화이트",fn:b=>b.type!=="red"}];
let preset="all", view="table";
document.getElementById("presets").innerHTML=PRESETS.map(p=>
  `<button data-p="${p.k}" aria-pressed="${p.k===preset}">${p.label}</button>`).join("");
document.getElementById("chips").innerHTML=ORDER.map(k=>{
  const n=B.filter(b=>b.status===k).reduce((s,b)=>s+qty(b),0);
  return `<button data-k="${k}" aria-pressed="false" style="--c:var(${S[k].v})"
    title="${S[k].label}"><i class="d2"></i>${n}</button>`}).join("");
function rows(list){
  const t=document.getElementById("rows");
  if(!list.length){t.innerHTML=`<p class="empty">해당 없음</p>`;return}
  t.innerHTML=list.map(b=>`<button class="item" data-id="${b.id}">
    <span class="id">${code(b)}</span>
    <span class="nm">${qty(b)>1?`<b>×${qty(b)}</b>`:""}<span>${esc(b.display)}</span></span>
    <span class="vt">${vint(b)}</span><span class="rg">${esc(b.region)}</span>
    <span class="st" style="--c:${cvar(b)}">${S[b.status].label}</span>
    <span class="win">${b.drink_from}–${b.drink_to}</span>
    <span class="left">${b.drink_to-YEAR}y</span>
    <span class="pr">${usd(b.price.avg_usd)}</span></button>`).join("");
}
function timeline(list){
  const ticks=[]; for(let y=Math.ceil(lo/10)*10;y<=hi;y+=10)ticks.push(y);
  document.getElementById("tl").innerHTML=
    `<div class="tl-axis">${ticks.map(y=>`<span style="left:${pct(y)}%">${y}</span>`).join("")}</div>
     <div class="tl-body"><div class="tl-grid">${ticks.map(y=>`<i style="left:${pct(y)}%"></i>`).join("")}
       <div class="tl-now" style="left:${pct(YEAR)}%"></div></div>
       ${list.map(b=>`<div class="row">
         <div class="rname" title="${esc(b.display)}">${esc(b.display)} <em>${vint(b)}</em></div>
         <div class="track"><a class="bar2" href="#" data-id="${b.id}" style="--c:${cvar(b)};
           left:${pct(b.drink_from)}%;width:${Math.max(pct(b.drink_to)-pct(b.drink_from),1.2)}%"
           title="${esc(b.display)} ${b.drink_from}–${b.drink_to}"></a></div></div>`).join("")}</div>`;
}
const active=new Set(), q=document.getElementById("q"), sortEl=document.getElementById("sort");
const SORTS={close:(a,b)=>a.drink_to-b.drink_to||a.id-b.id,
  price:(a,b)=>b.price.avg_usd-a.price.avg_usd,
  vintage:(a,b)=>(a.vintage||9999)-(b.vintage||9999),
  name:(a,b)=>a.display.localeCompare(b.display)};
function apply(){
  const t=q.value.trim().toLowerCase(), pf=PRESETS.find(p=>p.k===preset).fn;
  const list=B.filter(b=>{
    if(!pf(b))return false;
    if(active.size&&!active.has(b.status))return false;
    if(!t)return true;
    return [b.display,b.producer,b.region,b.category,vint(b),code(b),...(b.grapes||[])]
      .join(" ").toLowerCase().includes(t)}).sort(SORTS[sortEl.value]);
  rows(list); timeline([...list].sort(SORTS.close));
  document.getElementById("count").textContent=
    `${list.reduce((s,b)=>s+qty(b),0)}병 · ${usd(list.reduce((s,b)=>s+value(b),0))}`;
}
document.getElementById("presets").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; preset=b.dataset.p;
  [...e.currentTarget.children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.p===preset));
  apply()});
document.getElementById("chips").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; const k=b.dataset.k;
  active.has(k)?active.delete(k):active.add(k);
  b.setAttribute("aria-pressed",active.has(k)); apply()});
document.getElementById("view").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; view=b.dataset.v;
  [...e.currentTarget.children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===view));
  document.getElementById("table-view").hidden=view!=="table";
  document.getElementById("time-view").hidden=view!=="time"});
q.addEventListener("input",apply); sortEl.addEventListener("change",apply);

/* bottom */
const mix={}; B.forEach(b=>{const m=mix[b.category]||(mix[b.category]=[0,0]);m[0]+=qty(b);m[1]+=value(b)});
const mm=Math.max(...Object.values(mix).map(v=>v[1]));
document.getElementById("mix").innerHTML=Object.entries(mix).sort((a,b)=>b[1][1]-a[1][1])
  .map(([c,[n,v]])=>`<div><span>${esc(c)}</span><em>${n}병</em><b>${usd(v)}</b>
    <span class="t2"><i style="width:${v/mm*100}%"></i></span></div>`).join("");
document.getElementById("gaps").innerHTML=DATA.gaps.map(g=>`<div class="gap-i">
  <h3>${esc(g.title)}<span class="tag" style="--c:var(${g.severity==="high"?"--s-urgent":"--s-now"})">${g.severity==="high"?"우선":"보완"}</span></h3>
  <p>${esc(g.why.split(".")[0])}.</p>
  <div class="picks">${g.picks.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`).join("");
document.getElementById("flags").innerHTML=(DATA.flags||[]).map(f=>`<div class="flag">
  <h3><em>${code(byId[f.id])}</em>${esc(f.title)}</h3><p>${esc(f.text)}</p></div>`).join("")
  ||`<p class="empty">없음</p>`;
document.getElementById("foot").textContent=DATA.price_note+" "+DATA.storage.note;

/* panel */
const panel=document.getElementById("panel"), scrim=document.getElementById("scrim");
let lastFocus=null;
function openPanel(id){
  const b=byId[id]; if(!b)return; const p=b.profile, pr=b.price;
  document.getElementById("panel-inner").innerHTML=`
    <div class="p-head"><div class="code">${code(b)}</div><h2 id="p-title">${esc(b.display)}</h2>
      <div class="p-sub"><span>${vint(b)}</span><span>${esc(b.region)}</span>
        <span style="color:${cvar(b)}">${S[b.status].label}</span>
        <span>${b.drink_from}–${b.drink_to}</span></div></div>
    <div class="p-body">
      <div class="p-price">
        <div class="cf">${pr.confidence==="none"?"참고 추정가 · WS 미등재":"Wine-Searcher 전세계 평균"}</div>
        <div class="amt"><b>${usd(pr.avg_usd)}</b><span>${esc(pr.basis||"750ml ex-tax")}${qty(b)>1?` · ${qty(b)}병`:""}</span></div>
        <div class="krw">≈ ₩${won(pr.avg_usd).toLocaleString()}</div>
        <div class="cf">신뢰도 <b>${CONF[pr.confidence]}</b>${pr.note?` — ${esc(pr.note)}`:""}</div>
        ${pr.verified?`<div class="cf" style="color:var(--s-peak)">✓ ${esc(pr.verified)}</div>`:""}
        <a class="ws" href="${b.ws_url}" target="_blank" rel="noopener noreferrer">Wine-Searcher ↗</a></div>
      <div class="p-win"><div class="ba">
        <div class="fill" style="--c:${cvar(b)};left:${pct(b.drink_from)}%;
             width:${Math.max(pct(b.drink_to)-pct(b.drink_from),1.5)}%"></div>
        <div class="mark" style="left:${pct(YEAR)}%"></div></div>
        <div class="ends"><span>${lo}</span><span>${hi}</span></div></div>
      <div class="blk"><h3>Style</h3><p class="lead">${esc(p.style)}</p></div>
      <div class="blk"><h3>Tasting</h3><p>${esc(p.tasting)}</p></div>
      <div class="blk"><h3>Background</h3><p>${esc(p.story)}</p></div>
      <div class="blk"><h3>Service</h3><dl class="serve">
        <div><dt>TEMP</dt><dd>${esc(p.serve.temp)}</dd></div>
        <div><dt>DECANT</dt><dd>${esc(p.serve.decant)}</dd></div>
        <div><dt>GLASS</dt><dd>${esc(p.serve.glass)}</dd></div></dl></div>
      <div class="blk"><h3>Pairing</h3><div class="tags">${p.pair.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
      <div class="blk"><h3>Note</h3><p>${esc(b.notes)}</p></div>
      <div class="p-meta">
        <div><b>PRODUCER</b><span>${esc(b.producer)}</span></div>
        ${b.classification?`<div><b>CLASS</b><span>${esc(b.classification)}</span></div>`:""}
        ${b.grapes?.length?`<div><b>GRAPES</b><span>${b.grapes.map(esc).join(" · ")}</span></div>`:""}
        ${b.abv?`<div><b>ABV</b><span>${b.abv}%</span></div>`:""}
        <div><b>FORMAT</b><span>${b.format_ml??750}ml</span></div>
        <div><b>QTY</b><span>${qty(b)}</span></div></div></div>`;
  lastFocus=document.activeElement; panel.hidden=false;
  requestAnimationFrame(()=>{panel.classList.add("on");scrim.classList.add("on")});
  panel.scrollTop=0; document.getElementById("close").focus();
}
function closePanel(){panel.classList.remove("on");scrim.classList.remove("on");
  setTimeout(()=>{panel.hidden=true},200); lastFocus?.focus()}
scrim.addEventListener("click",closePanel);
document.getElementById("close").addEventListener("click",closePanel);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!panel.hidden)closePanel();
  else if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-id]"); if(!t)return; e.preventDefault(); openPanel(+t.dataset.id)});

apply();
</script>
